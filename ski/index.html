<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ski Stunt Simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }

/* --- Menu Overlay --- */
#menu-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #1a3a6a 0%, #4a90d9 40%, #87ceeb 80%, #f0f4ff 100%);
  transition: opacity 0.5s;
}
#menu-overlay.hidden { opacity: 0; pointer-events: none; }
#menu-overlay h1 {
  font-size: 52px; color: #fff; text-shadow: 3px 3px 8px rgba(0,0,0,0.5);
  margin-bottom: 8px; letter-spacing: 2px;
}
#menu-overlay .subtitle {
  font-size: 16px; color: rgba(255,255,255,0.8); margin-bottom: 40px;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
}
.menu-section { margin-bottom: 20px; text-align: center; }
.menu-section h2 { color: #fff; font-size: 14px; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 12px; opacity: 0.7; }
.scenario-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  max-width: 600px; margin: 0 auto;
}
.scenario-btn {
  background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
  color: #fff; padding: 12px 16px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: all 0.2s;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
}
.scenario-btn:hover { background: rgba(255,255,255,0.3); border-color: #fff; transform: scale(1.05); }
.scenario-btn.selected { background: rgba(255,255,255,0.35); border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.3); }
.scenario-btn .diff { font-size: 10px; opacity: 0.7; display: block; margin-top: 2px; }
#start-btn {
  background: rgba(255,200,0,0.9); border: none; color: #1a1a3a;
  padding: 16px 60px; border-radius: 30px; font-size: 20px; font-weight: 700;
  cursor: pointer; margin-top: 20px; transition: all 0.2s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
#start-btn:hover { background: #ffd700; transform: scale(1.05); }
/* --- Victory Overlay --- */
#victory-overlay {
  position: fixed; inset: 0; z-index: 90;
  display: none; align-items: center; justify-content: center;
  background: rgba(0,20,60,0.75);
}
#victory-overlay.visible { display: flex; }
#victory-overlay .victory-box {
  background: linear-gradient(135deg, rgba(10,30,80,0.95), rgba(30,60,120,0.95));
  border: 2px solid rgba(255,215,0,0.5); border-radius: 16px;
  padding: 36px 56px; text-align: center; color: #fff;
  box-shadow: 0 0 40px rgba(255,215,0,0.2);
  min-width: 360px;
}
#victory-overlay h2 { font-size: 36px; color: #ffd700; margin-bottom: 4px; text-shadow: 0 0 20px rgba(255,215,0,0.4); }
#victory-overlay .medal { font-size: 48px; margin: 8px 0; }
#victory-overlay .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; margin: 16px 0; text-align: left; font-size: 14px; }
#victory-overlay .stats-grid .label { color: rgba(255,255,255,0.6); }
#victory-overlay .stats-grid .value { color: #8cf; text-align: right; }
#victory-overlay .btn-row { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
#victory-overlay button {
  padding: 10px 28px; border-radius: 20px; font-size: 14px; font-weight: 600;
  cursor: pointer; border: 1px solid rgba(255,255,255,0.3); transition: all 0.2s;
}
#victory-overlay .btn-retry { background: rgba(255,200,0,0.9); color: #1a1a3a; border: none; }
#victory-overlay .btn-retry:hover { background: #ffd700; transform: scale(1.05); }
#victory-overlay .btn-menu { background: rgba(255,255,255,0.15); color: #fff; }
#victory-overlay .btn-menu:hover { background: rgba(255,255,255,0.3); }
/* --- Minimap --- */
#minimap {
  position: fixed; bottom: 12px; right: 12px; z-index: 15;
  pointer-events: none;
}
/* --- Goal HUD --- */
#goal-hud {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  color: #fff; font: 13px monospace; text-align: center;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
  pointer-events: none; z-index: 10;
}
.controls-hint {
  margin-top: 30px; color: rgba(255,255,255,0.6); font-size: 12px; line-height: 1.8;
}

/* --- HUD --- */
#hud {
  position: fixed; top: 12px; left: 12px;
  color: #fff; font: 14px monospace;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
  pointer-events: none; z-index: 10; line-height: 1.6;
}
#trick-display {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  pointer-events: none; z-index: 11; text-align: center;
}
#score-display {
  position: fixed; top: 12px; right: 12px;
  color: #fff; font: 14px monospace;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
  pointer-events: none; z-index: 10; text-align: right; line-height: 1.6;
}
#instructions {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.5); font: 12px monospace;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  pointer-events: none; z-index: 10; text-align: center;
}
#pause-overlay {
  position: fixed; inset: 0; z-index: 50;
  display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.6);
}
#pause-overlay.visible { display: flex; }
#pause-overlay .pause-box {
  background: rgba(0,20,60,0.9); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px; padding: 30px 50px; text-align: center; color: #fff;
}
/* Params panel */
#params-toggle {
  position: fixed; top: 12px; right: 12px; z-index: 20;
  background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.2);
  font: 12px monospace; padding: 4px 10px; cursor: pointer; border-radius: 4px;
  display: none;
}
#params-panel {
  position: fixed; top: 36px; right: 12px; z-index: 20;
  background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px; padding: 10px 14px; width: 280px;
  max-height: calc(100vh - 50px); overflow-y: auto;
  font: 11px monospace; color: #ccc; display: none;
}
#params-panel.open { display: block; }
#params-panel h3 { color: #fff; margin: 8px 0 4px; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
#params-panel h3:first-child { margin-top: 0; }
.param-row { display: flex; align-items: center; justify-content: space-between; margin: 3px 0; }
.param-row label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10px; }
.param-row input[type=range] { width: 90px; margin: 0 4px; }
.param-row .pv { width: 42px; text-align: right; color: #8cf; font-size: 10px; }
</style>
</head>
<body>

<!-- Menu -->
<div id="menu-overlay">
  <h1>⛷ SKI STUNT</h1>
  <div class="subtitle">Simulator</div>
  <div class="menu-section">
    <h2>Select Scenario</h2>
    <div class="scenario-grid" id="scenario-grid"></div>
  </div>
  <button id="start-btn">▶ START RUN</button>
  <div class="controls-hint">
    Mouse: control posture &amp; lean · Click: brake · Scroll: tuck/extend<br>
    Space: jump · R: restart · Esc: pause/menu · P: params
  </div>
</div>

<!-- In-game UI -->
<div id="hud"></div>
<div id="trick-display"></div>
<div id="score-display"></div>
<div id="instructions"></div>
<div id="pause-overlay"><div class="pause-box">
  <h2 style="margin-bottom:12px">PAUSED</h2>
  <p style="opacity:0.7;font-size:14px">Press Esc to resume · M for menu</p>
</div></div>
<div id="victory-overlay"><div class="victory-box" id="victory-box"></div></div>
<div id="goal-hud"></div>
<canvas id="minimap" width="220" height="60"></canvas>
<button id="params-toggle" onclick="document.getElementById('params-panel').classList.toggle('open')">⚙</button>
<div id="params-panel"></div>
<canvas id="c"></canvas>

<script>
// ═══════════════════════════════════════════════════════════════
//  SKI STUNT SIMULATOR — Complete Web Game
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hudEl = document.getElementById('hud');
const trickEl = document.getElementById('trick-display');
const scoreEl = document.getElementById('score-display');
const instrEl = document.getElementById('instructions');

let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════════════
//  SOUND ENGINE (Web Audio API)
// ═══════════════════════════════════════════════════════════════
const SFX = {
  ctx: null, master: null,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.5;
    this.master.connect(this.ctx.destination);

    // Persistent wind node
    this._windNoise = this._createNoise();
    this._windFilter = this.ctx.createBiquadFilter();
    this._windFilter.type = 'bandpass';
    this._windFilter.frequency.value = 400;
    this._windFilter.Q.value = 0.5;
    this._windGain = this.ctx.createGain();
    this._windGain.gain.value = 0;
    this._windNoise.connect(this._windFilter);
    this._windFilter.connect(this._windGain);
    this._windGain.connect(this.master);

    // Persistent ski contact noise
    this._skiNoise = this._createNoise();
    this._skiFilter = this.ctx.createBiquadFilter();
    this._skiFilter.type = 'highpass';
    this._skiFilter.frequency.value = 2000;
    this._skiGain = this.ctx.createGain();
    this._skiGain.gain.value = 0;
    this._skiNoise.connect(this._skiFilter);
    this._skiFilter.connect(this._skiGain);
    this._skiGain.connect(this.master);
  },
  _createNoise() {
    const bufferSize = this.ctx.sampleRate * 2;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const node = this.ctx.createBufferSource();
    node.buffer = buffer;
    node.loop = true;
    node.start();
    return node;
  },
  updateWind(speed) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const vol = Math.min(0.25, speed / 2000);
    const freq = 200 + Math.min(800, speed * 0.8);
    this._windGain.gain.linearRampToValueAtTime(vol, t + 0.1);
    this._windFilter.frequency.linearRampToValueAtTime(freq, t + 0.1);
  },
  updateSki(speed, onGround, braking) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    let vol = 0;
    if (onGround && speed > 20) {
      vol = Math.min(0.15, speed / 1500);
      if (braking) vol *= 3;
    }
    this._skiGain.gain.linearRampToValueAtTime(vol, t + 0.05);
    this._skiFilter.frequency.linearRampToValueAtTime(braking ? 1200 : 2500, t + 0.05);
  },
  playImpact(force) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(80 + Math.random() * 30, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + 0.3);
    g.gain.setValueAtTime(Math.min(0.6, force / 800), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.4);
    // Add noise burst
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.15, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * 0.2));
    const ns = this.ctx.createBufferSource();
    ns.buffer = buf;
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(Math.min(0.4, force / 600), t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    ns.connect(ng); ng.connect(this.master);
    ns.start(t);
  },
  playCrash() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // Heavy thud
    for (let i = 0; i < 3; i++) {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(50 + i * 20, t + i * 0.05);
      osc.frequency.exponentialRampToValueAtTime(20, t + 0.5 + i * 0.05);
      g.gain.setValueAtTime(0.5, t + i * 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.5 + i * 0.1);
      osc.connect(g); g.connect(this.master);
      osc.start(t + i * 0.05); osc.stop(t + 0.6 + i * 0.1);
    }
    // Crunch noise
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.5, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * 0.15));
    const ns = this.ctx.createBufferSource();
    ns.buffer = buf;
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(0.5, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    ns.connect(ng); ng.connect(this.master);
    ns.start(t);
  },
  playJump() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(400, t + 0.15);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.2);
  },
  playTrick(quality) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // Pleasant chime
    const notes = [523, 659, 784, 1047];
    const count = Math.min(4, 1 + Math.floor(quality / 25));
    for (let i = 0; i < count; i++) {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = notes[i % notes.length];
      g.gain.setValueAtTime(0.15, t + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.3);
      osc.connect(g); g.connect(this.master);
      osc.start(t + i * 0.1); osc.stop(t + i * 0.1 + 0.3);
    }
  },
  playLanding(quality) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // Ski scrape on landing
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.2, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * 0.3));
    const ns = this.ctx.createBufferSource();
    ns.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 3000; f.Q.value = 1;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    ns.connect(f); f.connect(g); g.connect(this.master);
    ns.start(t);
  }
};

// ═══════════════════════════════════════════════════════════════
//  SCENARIO DEFINITIONS
// ═══════════════════════════════════════════════════════════════
const SCENARIOS = [
  {
    name: 'Bunny Slope', diff: 'Easy', id: 'bunny',
    desc: 'Gentle slope with small bumps',
    victory: { type: 'finish', scoreGoal: 50, goldScore: 200, silverScore: 100 },
    generate(pts) {
      let x = -200, y = 300, slope = 0.12;
      for (let i = 0; i < 500; i++) {
        pts.push({ x, y, type: 'snow' });
        slope += (Math.sin(i * 0.05) * 0.01);
        slope = Math.max(0.06, Math.min(0.2, slope));
        x += 50; y += 50 * slope;
      }
    }
  },
  {
    name: 'Big Air', diff: 'Medium', id: 'bigair',
    desc: 'Series of large jumps',
    victory: { type: 'finish', scoreGoal: 200, goldScore: 600, silverScore: 350 },
    generate(pts) {
      let x = -200, y = 300;
      const addSlope = (count, s) => { for (let i = 0; i < count; i++) { pts.push({x, y, type:'snow'}); x += 50; y += 50 * s; }};
      const addJump = (rampLen, rampAngle, gapLen, landLen) => {
        // Approach ramp up
        for (let i = 0; i < rampLen; i++) { pts.push({x, y, type:'snow'}); x += 50; y += 50 * (rampAngle + 0.1 * i / rampLen); }
        // Lip (launch point, angle goes negative = uphill)
        pts.push({x, y, type:'snow'}); x += 40; y -= 40 * 0.35;
        pts.push({x, y, type:'snow'}); x += 30; y -= 30 * 0.15;
        // Gap
        for (let i = 0; i < gapLen; i++) { pts.push({x, y, type:'gap'}); x += 50; y += 50 * 0.4; }
        // Landing ramp
        for (let i = 0; i < landLen; i++) { pts.push({x, y, type:'snow'}); x += 50; y += 50 * 0.25; }
      };
      addSlope(8, 0.18);
      addJump(4, 0.15, 5, 6);
      addSlope(6, 0.12);
      addJump(5, 0.18, 7, 8);
      addSlope(6, 0.1);
      addJump(3, 0.2, 4, 5);
      addSlope(10, 0.15);
      addJump(6, 0.16, 8, 10);
      addSlope(40, 0.1);
    }
  },
  {
    name: 'Mogul Run', diff: 'Medium', id: 'moguls',
    desc: 'Bumpy mogul field with rhythm',
    victory: { type: 'finish', scoreGoal: 100, goldScore: 400, silverScore: 200 },
    generate(pts) {
      let x = -200, y = 300;
      // Initial slope
      for (let i = 0; i < 10; i++) { pts.push({x, y, type:'snow'}); x += 50; y += 50 * 0.15; }
      // Mogul field
      for (let i = 0; i < 60; i++) {
        const mogulPhase = Math.sin(i * 0.9) * 18;
        pts.push({x, y: y + mogulPhase, type:'snow'});
        x += 35; y += 35 * 0.12;
      }
      // Runout
      for (let i = 0; i < 30; i++) { pts.push({x, y, type:'snow'}); x += 50; y += 50 * 0.08; }
    }
  },
  {
    name: 'Cliff Drop', diff: 'Hard', id: 'cliff',
    desc: 'Steep drops and technical landings',
    victory: { type: 'finish', scoreGoal: 300, goldScore: 800, silverScore: 500 },
    generate(pts) {
      let x = -200, y = 200;
      const slope = (n, s) => { for (let i = 0; i < n; i++) { pts.push({x, y, type:'snow'}); x += 50; y += 50 * s; }};
      const cliff = (height) => {
        pts.push({x, y, type:'snow'});
        x += 30; // short lip
        pts.push({x, y: y - 15, type:'snow'}); // slight upkick
        x += 20;
        pts.push({x, y: y + height * 0.2, type:'gap'});
        x += 30;
        pts.push({x, y: y + height, type:'snow'});
      };
      slope(10, 0.2);
      cliff(120);
      slope(8, 0.15);
      cliff(80);
      slope(6, 0.18);
      cliff(150);
      slope(10, 0.12);
      cliff(100);
      slope(30, 0.1);
    }
  },
  {
    name: 'Halfpipe', diff: 'Hard', id: 'halfpipe',
    desc: 'Halfpipe for aerial tricks',
    victory: { type: 'finish', scoreGoal: 400, goldScore: 1000, silverScore: 600 },
    generate(pts) {
      let x = -200, y = 300;
      // Approach
      for (let i = 0; i < 12; i++) { pts.push({x, y, type:'snow'}); x += 50; y += 50 * 0.2; }
      // Transition into pipe
      for (let i = 0; i < 4; i++) { pts.push({x, y, type:'snow'}); x += 40; y += 40 * (0.2 - i * 0.12); }
      // Halfpipe walls (series of U-shapes)
      const pipeWidth = 200;
      const wallHeight = 100;
      for (let rep = 0; rep < 6; rep++) {
        // Left wall up
        for (let i = 0; i < 6; i++) {
          const t = i / 5;
          const cy = y + wallHeight * (1 - Math.cos(t * Math.PI)) * 0.5;
          const cx = x + pipeWidth * 0.5 * (1 - Math.cos(t * Math.PI)) * 0.5;
          pts.push({x: cx, y: cy - wallHeight * t, type:'snow'});
        }
        // Flat bottom
        x += pipeWidth * 0.15;
        pts.push({x, y, type:'snow'});
        x += pipeWidth * 0.3;
        pts.push({x, y, type:'snow'});
        // Right wall up
        for (let i = 0; i < 6; i++) {
          const t = i / 5;
          pts.push({x: x + pipeWidth * 0.15 * t, y: y - wallHeight * 0.5 * Math.sin(t * Math.PI), type:'snow'});
        }
        x += pipeWidth * 0.35;
      }
      // Runout
      for (let i = 0; i < 20; i++) { pts.push({x, y, type:'snow'}); x += 50; y += 50 * 0.05; }
    }
  },
  {
    name: 'Backcountry', diff: 'Medium', id: 'backcountry',
    desc: 'Natural terrain with varied features',
    victory: { type: 'finish', scoreGoal: 150, goldScore: 500, silverScore: 250 },
    generate(pts) {
      let x = -200, y = 300, slope = 0.15;
      for (let i = 0; i < 400; i++) {
        pts.push({ x, y, type: 'snow' });
        // Natural slope variation
        slope += (Math.sin(i * 0.03) * 0.008 + Math.sin(i * 0.11) * 0.005);
        slope = Math.max(0.04, Math.min(0.35, slope));
        // Occasional natural kickers
        if (i > 15 && i % 40 < 2 && slope > 0.12) {
          x += 40; y -= 25;
          pts.push({x, y, type:'snow'});
          x += 50; y += 50 * 0.5;
          pts.push({x, y, type:'snow'});
        } else {
          x += 50; y += 50 * slope;
        }
      }
    }
  },
  {
    name: 'Speed Run', diff: 'Easy', id: 'speed',
    desc: 'Steep and fast — max velocity',
    victory: { type: 'finish', scoreGoal: 80, goldScore: 300, silverScore: 150 },
    generate(pts) {
      let x = -200, y = 200;
      for (let i = 0; i < 400; i++) {
        pts.push({x, y, type:'snow'});
        const slope = 0.25 + Math.sin(i * 0.02) * 0.08;
        x += 60; y += 60 * slope;
      }
    }
  },
  {
    name: 'Stunt Park', diff: 'Expert', id: 'stuntpark',
    desc: 'Rails, kickers, and gaps galore',
    victory: { type: 'finish', scoreGoal: 500, goldScore: 1500, silverScore: 800 },
    generate(pts) {
      let x = -200, y = 300;
      const slope = (n, s) => { for (let i = 0; i < n; i++) { pts.push({x, y, type:'snow'}); x += 50; y += 50 * s; }};
      const kicker = (angle) => {
        for (let i = 0; i < 3; i++) { pts.push({x, y, type:'snow'}); x += 40; y += 40 * 0.15; }
        pts.push({x, y, type:'snow'}); x += 35; y -= 35 * angle;
        pts.push({x, y, type:'snow'});
        for (let i = 0; i < 4; i++) { pts.push({x, y: y + (i+1) * 25, type:'gap'}); x += 45; }
        y += 4 * 25;
        for (let i = 0; i < 5; i++) { pts.push({x, y, type:'snow'}); x += 50; y += 50 * 0.15; }
      };
      slope(6, 0.18);
      kicker(0.3);
      slope(4, 0.12);
      kicker(0.4);
      slope(4, 0.15);
      kicker(0.25);
      slope(3, 0.2);
      kicker(0.5);
      slope(4, 0.1);
      kicker(0.35);
      slope(30, 0.1);
    }
  },
];

let terrainPoints = [];
let trees = [];
let snowflakes = [];

function buildTerrain(scenarioIdx) {
  terrainPoints = [];
  SCENARIOS[scenarioIdx].generate(terrainPoints);
  // Generate trees
  trees = [];
  const rng = mulberry32(42);
  for (let i = 0; i < terrainPoints.length - 1; i++) {
    if (rng() < 0.12 && terrainPoints[i].type === 'snow') {
      const p = terrainPoints[i];
      trees.push({
        x: p.x + (rng() - 0.5) * 30,
        y: p.y,
        h: 30 + rng() * 40,
        w: 10 + rng() * 8,
        shade: rng(),
      });
    }
  }
  // Snowflakes
  snowflakes = [];
  for (let i = 0; i < 150; i++) {
    snowflakes.push({
      x: Math.random() * 4000 - 1000,
      y: Math.random() * 2000 - 500,
      r: 1 + Math.random() * 2,
      vx: -10 - Math.random() * 20,
      vy: 15 + Math.random() * 25,
      phase: Math.random() * Math.PI * 2,
    });
  }
}

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function getTerrainAt(px) {
  for (let i = 0; i < terrainPoints.length - 1; i++) {
    const a = terrainPoints[i], b = terrainPoints[i + 1];
    if (px >= a.x && px < b.x) {
      const t = (px - a.x) / (b.x - a.x);
      const ty = a.y + t * (b.y - a.y);
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      return { y: ty, angle, segIdx: i, type: a.type };
    }
  }
  const last = terrainPoints[terrainPoints.length - 1];
  return { y: last.y, angle: 0, segIdx: terrainPoints.length - 2, type: 'snow' };
}

//  TRICK DETECTION
// ═══════════════════════════════════════════════════════════════
const TRICK_NAMES = {
  flip_back: 'Backflip',
  flip_front: 'Frontflip',
  double_back: 'Double Backflip',
  double_front: 'Double Frontflip',
  triple: 'Triple Flip!',
  cork: 'Cork 360',
  air_big: 'Big Air',
  air_huge: 'Massive Air',
  method: 'Method',
  tuck: 'Tuck',
  spread: 'Spread Eagle',
  clean_land: 'Clean Landing',
  butter: 'Butter Landing',
};

// Commentary message helpers
const COMMENTARY = {
  goodFlips: ["Awesome!", "Unbelievable!", "Cool!", "Sick!", "Legendary!"],
  badLandings: ["Bummer!", "Ouch!", "Yikes!"],
  smoothLandings: ["Very Smooth!", "Nice!", "Butter!", "Clean!"],
  crashes: ["That's gotta hurt!", "Call an ambulance!", "Wipeout!", "Brutal!"],
  bigAir: ["Sky High!", "Massive!", "Orbit!"],
};

function addCommentary(category) {
  const pool = COMMENTARY[category];
  if (!pool || pool.length === 0) return;
  const text = pool[Math.floor(Math.random() * pool.length)];
  commentaryMessages.push({
    text,
    life: 2.5,
    x: (Math.random() - 0.5) * 200,
    y: -40 - Math.random() * 60,
    vy: -20,
    scale: 1.2 + Math.random() * 0.5,
    color: category === 'crashes' || category === 'badLandings' ? '#ff6644' : '#44ff88',
  });
}

function evaluateLandingQuality(impactSpeed, landAngleDiff) {
  if (landAngleDiff < 0.17 && impactSpeed < 200) {
    return 'perfect';
  } else if (landAngleDiff < 0.44 && impactSpeed < 400) {
    return 'smooth';
  } else {
    return 'hard';
  }
}

function detectTricks() {
  if (skier.crashed) return;
  if (skier.onGround && !skier.wasOnGround && skier.airTime > 0.3) {
    const rot = Math.abs(skier.totalRotation);
    const flips = Math.floor(rot / (Math.PI * 2) + 0.3);
    const airScore = Math.floor(skier.airTime * cfg.airtimePoints * 10);
    let trickScore = airScore;
    let trickName = '';
    const direction = skier.totalRotation > 0 ? 'front' : 'back';

    // Flip scoring: flipPoints * rotations (bonus for more)
    if (flips >= 3) {
      trickName = TRICK_NAMES.triple;
      trickScore += cfg.flipPoints * flips * 1.5;
    } else if (flips >= 2) {
      trickName = TRICK_NAMES[`double_${direction}`];
      trickScore += cfg.flipPoints * flips * 1.2;
    } else if (flips >= 1) {
      trickName = TRICK_NAMES[`flip_${direction}`];
      trickScore += cfg.flipPoints * flips;
    } else if (rot > Math.PI * 0.5) {
      trickName = TRICK_NAMES.cork;
      trickScore += cfg.flipPoints * 0.5;
    }

    if (skier.airTime > 2.5) {
      if (!trickName) trickName = TRICK_NAMES.air_huge;
      trickScore += 50;
      addCommentary('bigAir');
    } else if (skier.airTime > 1.2) {
      if (!trickName) trickName = TRICK_NAMES.air_big;
      trickScore += 20;
    }

    if (skier.crouch > 0.7) {
      trickName = (trickName ? trickName + ' + ' : '') + TRICK_NAMES.tuck;
      trickScore += 15;
    }

    // Landing quality evaluation
    const terrain = getTerrainAt(skier.x);
    const landAngleDiff = Math.abs(skier.bodyAngle - terrain.angle);
    const impactSpeed = Math.abs(skier.vy);
    let landingQuality = 'hard';
    let landingMultiplier = 1.0;
    let landingMsg = '';

    if (skier.airTime > 0.4) {
      landingQuality = evaluateLandingQuality(impactSpeed, landAngleDiff);
      if (landingQuality === 'perfect') {
        landingMultiplier = cfg.perfectMultiplier;
        landingMsg = 'Perfect Landing!';
        addCommentary('smoothLandings');
      } else if (landingQuality === 'smooth') {
        landingMultiplier = cfg.smoothMultiplier;
        landingMsg = 'Smooth Landing!';
        if (flips >= 1) addCommentary('smoothLandings');
      } else {
        landingMultiplier = 1.0;
        landingMsg = 'Hard Landing!';
        if (skier.airTime > 1.0) addCommentary('badLandings');
      }
    }

    // Speed bonus at landing
    const speedBonus = Math.floor(skier.speed * 0.02);
    trickScore += speedBonus;

    // Apply landing multiplier
    trickScore = Math.floor(trickScore * landingMultiplier);

    // Commentary for good flips
    if (flips >= 2) addCommentary('goodFlips');

    // Combo system
    const now = performance.now() / 1000;
    if (now - score.lastTrickTime < 4) {
      score.combo = Math.min(5, score.combo + 0.5);
    } else {
      score.combo = 1;
    }
    score.lastTrickTime = now;

    if (trickScore > 5 && (trickName || landingMsg)) {
      const finalScore = Math.floor(trickScore * score.combo);
      score.total += finalScore;
      const displayName = trickName ? trickName : landingMsg;
      score.tricks.push({ name: displayName, score: finalScore });
      runStats.jumps++;
      runStats.totalFlips += flips;

      trickMessages.push({
        text: displayName,
        score: finalScore,
        combo: score.combo,
        life: 2.5,
        y: 0,
        landingQuality,
      });

      if (trickName && landingMsg) {
        trickMessages.push({
          text: landingMsg,
          score: 0,
          combo: 1,
          life: 2.0,
          y: 25,
          landingQuality,
        });
      }

      SFX.playTrick(finalScore);
      SFX.playLanding(landingQuality === 'perfect' ? 1 : landingQuality === 'smooth' ? 0.7 : 0.3);
    } else if (skier.airTime > 0.4) {
      SFX.playLanding(0.3);
      if (landingMsg && skier.airTime > 0.6) {
        trickMessages.push({
          text: landingMsg,
          score: 0,
          combo: 1,
          life: 1.5,
          y: 0,
          landingQuality,
        });
      }
    }

    // Reset rotation tracking
    skier.totalRotation = 0;
  }
}

// ═══════════════════════════════════════════════════════════════
//  RAGDOLL CRASH SYSTEM
// ═══════════════════════════════════════════════════════════════
function initRagdoll() {
  // For connected ragdoll, we just let the articulated body continue
  // with relaxJtPd (near-zero PD) which is already handled in computePDTorque.
  // Only explode into parts for extreme impacts.
  skier.ragdoll = null; // null = connected ragdoll (use articulated links)
}

function initExplosionRagdoll() {
  // Extreme impact: scatter body parts
  const angle = skier.bodyAngle;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const speed = skier.speed;
  const parts = [];
  const offsets = [
    { name: 'head', ox: 0, oy: -30, r: 5, color: '#2255aa' },
    { name: 'torso', ox: 0, oy: -18, r: 6, color: '#cc3333' },
    { name: 'hip', ox: 0, oy: -5, r: 4, color: '#1a1a3a' },
    { name: 'leg_l', ox: -4, oy: 5, r: 3, color: '#1a1a3a', isLong: true },
    { name: 'leg_r', ox: 4, oy: 5, r: 3, color: '#1a1a3a', isLong: true },
  ];
  for (const o of offsets) {
    const px = skier.x + o.ox * cos - o.oy * sin;
    const py = skier.y + o.ox * sin + o.oy * cos;
    parts.push({
      x: px, y: py,
      vx: skier.vx + (Math.random() - 0.5) * speed * 0.6,
      vy: skier.vy + (Math.random() - 0.5) * speed * 0.4 - Math.random() * 250,
      angle: angle + (Math.random() - 0.5) * 2,
      angVel: (Math.random() - 0.5) * 15,
      r: o.r, color: o.color,
      isLong: o.isLong || false,
      name: o.name,
    });
  }
  skier.ragdoll = parts;
}

function updateRagdoll(dt) {
  if (skier.ragdoll) {
    // Explosion mode: update scattered parts
    for (const p of skier.ragdoll) {
      p.vy += cfg.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.angle += p.angVel * dt;
      const t = getTerrainAt(p.x);
      if (p.y > t.y - p.r) {
        p.y = t.y - p.r;
        p.vy *= -0.3;
        p.vx *= 0.85;
        p.angVel *= 0.8;
        if (Math.abs(p.vy) < 10) p.vy = 0;
      }
      p.vx *= 0.998;
      p.angVel *= 0.995;
    }
  } else {
    // Connected ragdoll: run articulated physics with floppy joints
    const substeps = Math.min(PHYS.maxSubsteps, Math.round(dt / PHYS.fixedDt));
    const subDt = PHYS.fixedDt;
    for (let step = 0; step < substeps; step++) {
      // PD torques (will be near-zero due to crashed check in computePDTorque)
      for (let i = 1; i < 4; i++) {
        const relAngle = links[i].angle - links[i-1].angle;
        const relAngVel = links[i].angVel - links[i-1].angVel;
        const torque = computePDTorque(i, relAngle, relAngVel, 0);
        links[i].angVel += (torque / links[i].inertia) * subDt;
        links[i-1].angVel -= (torque / links[i-1].inertia) * subDt;
      }
      // Gravity
      for (const link of links) {
        link.vel.y += cfg.gravity * subDt;
      }
      // Ground contact
      for (const link of links) {
        applyGroundForces(link, subDt, false);
      }
      // Integrate
      for (const link of links) {
        link.pos.x += link.vel.x * subDt;
        link.pos.y += link.vel.y * subDt;
        link.angle += link.angVel * subDt;
      }
      // Joint constraints
      solveJointConstraints();
      // Damping (stronger during ragdoll to prevent endless spinning)
      const angDamp = skier.crashed ? cfg.ragdollDamping : cfg.jointDamping;
      for (const link of links) {
        link.angVel *= angDamp;
      }
    }
    // Update skier position for camera tracking
    skier.x = links[0].pos.x;
    skier.y = links[0].pos.y;
    skier.vx = links[0].vel.x;
    skier.vy = links[0].vel.y;
    skier.speed = Math.sqrt(skier.vx * skier.vx + skier.vy * skier.vy);

    // Ragdoll telemetry
    if (!skier._lastRagdollTelemetry) skier._lastRagdollTelemetry = 0;
    skier._lastRagdollTelemetry += dt;
    if (skier._lastRagdollTelemetry >= 0.25) {
      skier._lastRagdollTelemetry = 0;
      const DEG_INV = 180 / Math.PI;
      const ankleA = (links[1].angle - links[0].angle) * DEG_INV;
      const hipA = (links[2].angle - links[1].angle) * DEG_INV;
      const shoulderA = (links[3].angle - links[2].angle) * DEG_INV;
      console.log(
        `[RAGDOLL] spd=${skier.speed.toFixed(0)} pos=(${skier.x.toFixed(0)},${skier.y.toFixed(0)})` +
        ` t=${skier.crashTimer.toFixed(1)}s` +
        ` | angles: ski=${(links[0].angle * DEG_INV).toFixed(0)}° leg=${(links[1].angle * DEG_INV).toFixed(0)}°` +
        ` torso=${(links[2].angle * DEG_INV).toFixed(0)}° arms=${(links[3].angle * DEG_INV).toFixed(0)}°` +
        ` | joints: ankle=${ankleA.toFixed(0)}° hip=${hipA.toFixed(0)}° shldr=${shoulderA.toFixed(0)}°` +
        ` | angVel: ${links.map(l => l.angVel.toFixed(1)).join('/')}`
      );
    }
  }
}

function drawRagdoll(camX, camY) {
  if (skier.ragdoll) {
    // Explosion mode: draw scattered parts
    for (const p of skier.ragdoll) {
      const sx = p.x - camX + W * 0.3;
      const sy = p.y - camY + H * 0.5;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(p.angle);
      if (p.isLong) {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.r * 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      ctx.restore();
    }
  } else {
    // Connected ragdoll: draw the articulated figure normally (it flops)
    if (!links || links.length < 4) return;
    const ox = -camX + W * 0.3;
    const oy = -camY + H * 0.5;

    // Draw skis
    if (!skiDetached) {
      drawSkiPair(links[0].pos.x, links[0].pos.y, links[0].angle, camX, camY);
    }
    // Draw leg, boot, torso, arms
    drawLinkPolygon(links[1], camX, camY, 1);
    if (links[0].bootPts) {
      ctx.save();
      ctx.translate(links[0].pos.x + ox, links[0].pos.y + oy);
      ctx.rotate(links[0].angle);
      ctx.beginPath();
      ctx.moveTo(links[0].bootPts[0].x, links[0].bootPts[0].y);
      for (let i = 1; i < links[0].bootPts.length; i++) {
        ctx.lineTo(links[0].bootPts[i].x, links[0].bootPts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = '#2a2a50';
      ctx.fill();
      ctx.strokeStyle = '#1a1a3a';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }
    drawLinkPolygon(links[2], camX, camY, 2);
    drawLinkPolygon(links[3], camX, camY, 3);
  }
}

// ═══════════════════════════════════════════════════════════════
//  PHYSICS (Rigid-Body Articulated Figure)
// ═══════════════════════════════════════════════════════════════

// --- Rigid Body Link Definitions ---
const LINK_SCALE = 1; // work in pixels directly
const DEG = Math.PI / 180;

function makeLink(mass, jointOrg, points, tag) {
  // Compute moment of inertia from polygon (approximate)
  let moi = 0;
  for (const p of points) {
    moi += p.x * p.x + p.y * p.y;
  }
  moi = mass * moi / points.length * 0.5;
  if (moi < mass * 20) moi = mass * 20; // minimum
  return { mass, inertia: moi, jointOrg, points, tag,
    pos: {x:0, y:0}, vel: {x:0, y:0}, angle: 0, angVel: 0 };
}

function initLinks() {
