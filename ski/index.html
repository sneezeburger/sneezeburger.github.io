// --- Joint PD Controllers ---
// Scaled for pixel-space where gravitational torques are large.
// Torque needed to hold torso: ~mass*g*offset = 10*392*10 ≈ 40000.
// kp must produce this at moderate error angles (~0.5 rad).
const JOINTS = [
  { kp: 0, kd: 0, minA: 0, maxA: 0, tMin: 0, tMax: 0 },
  { kp: 120000, kd: 8000, minA: -130*DEG, maxA: 10*DEG, tMin: -1200000, tMax: 1200000 },  // ankle
  { kp: 50000, kd: 5000, minA: -40*DEG, maxA: 140*DEG, tMin: -1000000, tMax: 1000000 },   // hip
  { kp: 20000, kd: 1500, minA: -90*DEG, maxA: 90*DEG, tMin: -120000, tMax: 120000 },    // shoulder
];

// Physics params (from .afig link_kp/kd, common.setup dt_sim, brakeMonitor cf)
const PHYS = {
  fixedDt: 0.001,     // from common.setup: dt_sim 0.001
  maxSubsteps: 30,    // cap substeps per frame
  linearDamping: 1.0,    // no linear damping (original has none; friction handles it)
};

let links = [];
let debugJoints = false;

// Listen for debug toggle
document.addEventListener('keydown', e => {
  if (e.key === 'j' || e.key === 'J') debugJoints = !debugJoints;
});

function initArticulatedBody(startX, startY) {
  links = initLinks();
  // Chain: ski(0) → leg(1) → torso(2) → arms(3)
  // startY = ankle Y position (caller places ankle above ground)

  const slopeAngle = getTerrainAt(startX).angle || 0;

  // Ski on the ground, aligned with slope
  // Ski origin = ankle position. Bottom of ski is ~24px below ankle.
  links[0].pos = {x: startX, y: startY};
  links[0].angle = slopeAngle;
  links[0].vel = {x: 0, y: 0};
  links[0].angVel = 0;

  // Leg: initial ankle angle -20° (moderate ski stance, hip above ankle)
  const initAnkle = -20 * DEG;
  links[1].angle = slopeAngle + initAnkle;
  const ankleWorld = worldPoint(links[0], links[0].jointOrg);
  links[1].pos = {x: ankleWorld.x, y: ankleWorld.y};
  links[1].vel = {x: 0, y: 0};
  links[1].angVel = 0;

  // Torso: hip angle +30° (torso tilts CW from leg = leans slightly forward)
  const initHip = 30 * DEG;
  links[2].angle = links[1].angle + initHip;
  const hipWorld = worldPoint(links[1], links[1].jointOrg);
  links[2].pos = {x: hipWorld.x, y: hipWorld.y};
  links[2].vel = {x: 0, y: 0};
  links[2].angVel = 0;

  // Arms: shoulder angle -35° (arms extend forward/down from torso)
  const initShoulder = -35 * DEG;
  links[3].angle = links[2].angle + initShoulder;
  const shoulderWorld = worldPoint(links[2], links[2].jointOrg);
  links[3].pos = {x: shoulderWorld.x, y: shoulderWorld.y};
  links[3].vel = {x: 0, y: 0};
  links[3].angVel = 0;
}

function rotatePoint(pt, angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  return { x: pt.x * c - pt.y * s, y: pt.x * s + pt.y * c };
}

function worldPoint(link, localPt) {
  const r = rotatePoint(localPt, link.angle);
  return { x: link.pos.x + r.x, y: link.pos.y + r.y };
}

function getJointWorldPos(linkIdx) {
  // Returns the world position of the joint origin on link[linkIdx]
  return worldPoint(links[linkIdx], links[linkIdx].jointOrg);
}

// --- Mouse → Target Angles ---
// From skier.keys, NEGATED for Y-down coordinate system.
// Mouse Y INVERTED: user wants top=stand, bottom=crouch.
function computeTargetAngles() {
  const my = 1 - Math.max(0, Math.min(1, mouseY));  // inverted: 1=top(stand), 0=bottom(crouch)
  const mx = Math.max(0, Math.min(1, mouseX));       // 0=left, 1=right

  // Ankle: original lerp(100,0,my) + lerp(60,0,mx), negated for Y-down
  const ankleTarget = (-160 + 100 * my + 60 * mx) * DEG;
  const ankle = Math.max(JOINTS[1].minA, Math.min(JOINTS[1].maxA, ankleTarget));

  // Hip: original lerp(-130,20,my) + lerp(20,-20,mx), negated for Y-down
  // X influence doubled (80° range instead of 40°) for more responsive lean
  const hipTarget = (110 - 150 * my + 80 * mx) * DEG;
  const hip = Math.max(JOINTS[2].minA, Math.min(JOINTS[2].maxA, hipTarget));

  // Shoulder: original lerp(20,70,my), negated for Y-down
  const shoulderTarget = (-20 - 50 * my) * DEG;
  const shoulder = Math.max(JOINTS[3].minA, Math.min(JOINTS[3].maxA, shoulderTarget));

  return [0, ankle, hip, shoulder];
}

// --- PD Controller Torque ---
// Standard PD: torque = kp*(target-current) - kd*angVel
// The jt_ext sign from the original is already accounted for in the
// Y-flipped polygon geometry and angle conventions.
function computePDTorque(jointIdx, currentAngle, relAngVel, targetAngle) {
  const j = JOINTS[jointIdx];
  if (j.kp === 0 && j.kd === 0) return 0;
  // Ragdoll mode: near-zero stiffness, moderate damping (from original relaxJtPd)
  if (skier.crashed) {
    const torque = -5.0 * relAngVel;
    return Math.max(-3000, Math.min(3000, torque));
  }
  const error = targetAngle - currentAngle;
  const mult = cfg.pdMultiplier;
  const torque = j.kp * mult * error - j.kd * mult * relAngVel;
  return Math.max(j.tMin * mult, Math.min(j.tMax * mult, torque));
}

// --- Ground Contact Forces (Penalty-Based) ---
function applyGroundForces(link, dt, isBraking) {
  let totalForce = 0;
  let anyContact = false;

  // Ski has very low friction along its direction (gliding on snow)
  const isSki = link.tag === 'ski';
  const skiAlongCf = isBraking ? cfg.brakeFriction : cfg.skiFriction;
  const bodyCf = cfg.bodyFriction;

  for (const localPt of link.points) {
    const wp = worldPoint(link, localPt);
    const terrain = getTerrainAt(wp.x);
    const terrainY = terrain.y;

    const pen = wp.y - terrainY;
    if (pen <= 0) continue; // not penetrating

    anyContact = true;

    // Velocity at contact point (v = link.vel + angVel × r)
    const r = rotatePoint(localPt, link.angle);
    const vpx = link.vel.x - link.angVel * r.y;
    const vpy = link.vel.y + link.angVel * r.x;

    // Ground normal (perpendicular to slope, pointing away from ground)
    // In Y-down: tangent=(cosθ,sinθ), outward normal = 90°CCW = (sinθ, -cosθ)
    const nx = Math.sin(terrain.angle);
    const ny = -Math.cos(terrain.angle);

    // Normal velocity component (positive = moving into ground)
    const vn = -(vpx * nx + vpy * ny);

    // Normal force: spring + damper, clamped non-negative
    let fn = cfg.groundKp * pen + cfg.groundKd * Math.max(0, vn);
    fn = Math.max(0, fn);
    fn = Math.min(fn, 50000); // cap to prevent explosion

    totalForce += fn;

    // Apply normal force (push up along normal)
    const fnx = fn * nx;
    const fny = fn * ny;

    // Friction calculation
    let ffx = 0, ffy = 0;

    if (isSki) {
      // Ski friction: very low along ski direction (gliding on snow)
      // In 2D side-view, there's no cross-ski direction — ski moves along its length
      const skiDirX = Math.cos(link.angle);
      const skiDirY = Math.sin(link.angle);
      const vAlong = vpx * skiDirX + vpy * skiDirY;

      // Along-ski friction (low for gliding, higher for braking)
      const ffAlong = skiAlongCf * fn;
      const maxAlong = Math.abs(vAlong) * link.mass / dt * 0.3;
      const fAlongClamped = Math.min(ffAlong, maxAlong);
      ffx = vAlong > 0 ? -fAlongClamped * skiDirX : (vAlong < 0 ? fAlongClamped * skiDirX : 0);
      ffy = vAlong > 0 ? -fAlongClamped * skiDirY : (vAlong < 0 ? fAlongClamped * skiDirY : 0);
    } else {
      // Isotropic Coulomb friction for body parts
      const tx = Math.cos(terrain.angle);
      const ty = Math.sin(terrain.angle);
      const vt = vpx * tx + vpy * ty;
      let ff = bodyCf * fn;
      const maxFriction = Math.abs(vt) * link.mass / dt * 0.5;
      ff = Math.min(ff, maxFriction);
      ffx = vt > 0 ? -ff * tx : (vt < 0 ? ff * tx : 0);
      ffy = vt > 0 ? -ff * ty : (vt < 0 ? ff * ty : 0);
    }

    // Total force on link
    const fx = fnx + ffx;
    const fy = fny + ffy;

    link.vel.x += (fx / link.mass) * dt;
    link.vel.y += (fy / link.mass) * dt;

    // Torque about center of mass: τ = r × F
    const torque = r.x * fy - r.y * fx;
    link.angVel += (torque / link.inertia) * dt;
  }
  return { totalForce, anyContact };
}

// --- Joint Constraint Solving ---
// Each joint connects link[i]'s jointOrg (top) to link[i+1]'s pos (bottom).
// The child link's pos (center of its bottom) is constrained to the parent's joint.
function solveJointConstraints() {
  for (let iter = 0; iter < 8; iter++) {
    for (let i = 0; i < 3; i++) {
      const parent = links[i];
      const child = links[i + 1];

      // Where the parent's joint is in world space
      const jointWorld = worldPoint(parent, parent.jointOrg);

      // The child's anchor point is its pos (link's origin = bottom center)
      const dx = jointWorld.x - child.pos.x;
      const dy = jointWorld.y - child.pos.y;

      if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) continue;

      const totalMass = parent.mass + child.mass;
      const parentRatio = child.mass / totalMass;
      const childRatio = parent.mass / totalMass;

      // Position correction (full correction each iteration)
      parent.pos.x -= dx * parentRatio;
      parent.pos.y -= dy * parentRatio;
      child.pos.x += dx * childRatio;
      child.pos.y += dy * childRatio;

      // Velocity correction: project out relative velocity along constraint
      const rp = rotatePoint(parent.jointOrg, parent.angle);
      const vpx = parent.vel.x - parent.angVel * rp.y;
      const vpy = parent.vel.y + parent.angVel * rp.x;
      const dvx = vpx - child.vel.x;
      const dvy = vpy - child.vel.y;

      const velBias = 0.3;
      parent.vel.x -= dvx * parentRatio * velBias;
      parent.vel.y -= dvy * parentRatio * velBias;
      child.vel.x += dvx * childRatio * velBias;
      child.vel.y += dvy * childRatio * velBias;
    }

    // Enforce joint angle limits
    // During ragdoll: use wider limits to allow flopping but prevent 360° spinning
    const ragdoll = skier.crashed;
    const RAG_LIMITS = [
      null, // link0 unused
      { minA: -Math.PI, maxA: Math.PI * 0.25 },    // ankle: -180° to 45°
      { minA: -Math.PI * 0.5, maxA: Math.PI },      // hip: -90° to 180°
      { minA: -Math.PI * 0.75, maxA: Math.PI * 0.75 } // shoulder: -135° to 135°
    ];
    for (let i = 1; i < 4; i++) {
      const j = ragdoll ? RAG_LIMITS[i] : JOINTS[i];
      if (!ragdoll && j.minA === 0 && j.maxA === 0) continue;
      const relAngle = links[i].angle - links[i-1].angle;
      if (relAngle < j.minA) {
        const correction = j.minA - relAngle;
        const totalMass = links[i].mass + links[i-1].mass;
        links[i].angle += correction * (links[i-1].mass / totalMass);
        links[i-1].angle -= correction * (links[i].mass / totalMass);
        const relAngVel = links[i].angVel - links[i-1].angVel;
        if (relAngVel < 0) {
          // During ragdoll, absorb most energy at limits (inelastic collision)
          const dampFactor = ragdoll ? 0.8 : 1.0;
          links[i].angVel -= relAngVel * (links[i-1].mass / totalMass) * dampFactor;
          links[i-1].angVel += relAngVel * (links[i].mass / totalMass) * dampFactor;
        }
      } else if (relAngle > j.maxA) {
        const correction = j.maxA - relAngle;
        const totalMass = links[i].mass + links[i-1].mass;
        links[i].angle += correction * (links[i-1].mass / totalMass);
        links[i-1].angle -= correction * (links[i].mass / totalMass);
        const relAngVel = links[i].angVel - links[i-1].angVel;
        if (relAngVel > 0) {
          const dampFactor = ragdoll ? 0.8 : 1.0;
          links[i].angVel -= relAngVel * (links[i-1].mass / totalMass) * dampFactor;
          links[i-1].angVel += relAngVel * (links[i].mass / totalMass) * dampFactor;
        }
      }
    }
  }
}

// --- Main Physics Update ---
function updatePhysics(dt) {
  if (dt > 0.04) dt = 0.04;

  if (skier.crashed) {
    skier.crashTimer += dt;
    updateRagdoll(dt);
    SFX.updateWind(0);
    SFX.updateSki(0, false, false);
    return;
  }

  // Update lean for compatibility
  skier.lean = (mouseX - 0.5) * 2.5;
  skier.crouch = Math.max(0, Math.min(1, mouseY * 1.3));

  // Space bar jump — apply impulse to all links along ground normal
  skier.jumpCooldown = Math.max(0, skier.jumpCooldown - dt);
  if (skier.onGround && jumpPressed && skier.jumpCooldown <= 0) {
    const terrain = getTerrainAt(skier.x);
    const impulse = 140;
    const nx = Math.sin(terrain.angle);
    const ny = -Math.cos(terrain.angle);
    for (const link of links) {
      link.vel.x += nx * impulse;
      link.vel.y += ny * impulse;
    }
    skier.onGround = false;
    skier.jumpCooldown = 0.3;
    skier.totalRotation = 0;
    SFX.playJump();
  }

  const substeps = Math.min(PHYS.maxSubsteps, Math.round(dt / PHYS.fixedDt));
  const subDt = PHYS.fixedDt;
  let frameMaxForce = 0;
  let frameMaxSkiForce = 0;
  let frameMaxForceLink = '';
  let frameAnyContact = false;

  for (let step = 0; step < substeps; step++) {
    // 1. Compute target angles from mouse
    const targets = computeTargetAngles();

    // 2. Apply PD torques at joints
    for (let i = 1; i < 4; i++) {
      const relAngle = links[i].angle - links[i-1].angle;
      const relAngVel = links[i].angVel - links[i-1].angVel;
      const torque = computePDTorque(i, relAngle, relAngVel, targets[i]);

      // Apply equal and opposite torques (Newton's 3rd law)
      links[i].angVel += (torque / links[i].inertia) * subDt;
      links[i-1].angVel -= (torque / links[i-1].inertia) * subDt;
    }

    // 3. Apply gravity to all links
    for (const link of links) {
      link.vel.y += cfg.gravity * subDt;
    }

    // 4. Apply ground penalty forces
    for (const link of links) {
      const result = applyGroundForces(link, subDt, braking);
      if (result.anyContact) frameAnyContact = true;
      if (link.tag === 'ski') {
        frameMaxSkiForce = Math.max(frameMaxSkiForce, result.totalForce);
      } else if (link.tag !== 'arms') {
        // Arms excluded from crash force (too light to trigger realistic crashes)
        if (result.totalForce > frameMaxForce) {
          frameMaxForce = result.totalForce;
          frameMaxForceLink = link.tag;
        }
      }
    }

    // 5. Integrate positions (semi-implicit Euler)
    for (const link of links) {
      link.pos.x += link.vel.x * subDt;
      link.pos.y += link.vel.y * subDt;
      link.angle += link.angVel * subDt;
    }

    // 6. Solve joint constraints
    solveJointConstraints();

    // 7. Apply damping
    for (const link of links) {
      link.vel.x *= PHYS.linearDamping;
      link.vel.y *= PHYS.linearDamping;
      link.angVel *= cfg.jointDamping;
    }

    // 8. Angular momentum conservation when airborne (tuck = spin faster)
    if (!skier.onGround && !skier.crashed) {
      // Compute center of mass
      let cmx = 0, cmy = 0, totalMass = 0;
      for (const link of links) {
        cmx += link.mass * link.pos.x;
        cmy += link.mass * link.pos.y;
        totalMass += link.mass;
      }
      cmx /= totalMass;
      cmy /= totalMass;

      // Compute effective moment of inertia about CM
      let effectiveI = 0;
      for (const link of links) {
        const dx = link.pos.x - cmx;
        const dy = link.pos.y - cmy;
        effectiveI += link.inertia + link.mass * (dx * dx + dy * dy);
      }

      // Track angular momentum and adjust
      if (skier._prevAirI !== undefined && skier._prevAirI > 0) {
        // Compute current total angular momentum about CM
        let totalL = 0;
        for (const link of links) {
          const dx = link.pos.x - cmx;
          const dy = link.pos.y - cmy;
          const linkI = link.inertia + link.mass * (dx * dx + dy * dy);
          totalL += linkI * link.angVel;
        }
        // Scale angular velocities to conserve L as MOI distribution changes
        // Stronger correction for responsive tuck/extend rotation control
        const ratio = skier._prevAirI / effectiveI;
        const correction = 0.15 * (ratio - 1.0); // 15% per substep toward ideal
        for (const link of links) {
          link.angVel *= (1.0 + correction);
        }
      }
      skier._prevAirI = effectiveI;
    } else {
      skier._prevAirI = undefined;
    }
  }

  // --- Post-step: update skier state for other systems ---
  const skiLink = links[0];
  const torsoLink = links[2];

  skier.x = skiLink.pos.x;
  skier.y = skiLink.pos.y;
  skier.vx = skiLink.vel.x;
  skier.vy = skiLink.vel.y;
  skier.speed = Math.sqrt(skier.vx * skier.vx + skier.vy * skier.vy);
  skier.bodyAngle = torsoLink.angle;
  skier.angularVel = torsoLink.angVel;

  const wasOnGround = skier.onGround;
  skier.wasOnGround = wasOnGround;
  skier.onGround = frameAnyContact;

  // --- Physics telemetry (logged every 0.5s) ---
  if (!skier._lastTelemetry) skier._lastTelemetry = 0;
  skier._lastTelemetry += dt;
  if (skier._lastTelemetry >= 0.25) {
    skier._lastTelemetry = 0;
    const DEG_INV = 180 / Math.PI;
    const terrain = getTerrainAt(skier.x);
    const ankleA = (links[1].angle - links[0].angle) * DEG_INV;
    const hipA = (links[2].angle - links[1].angle) * DEG_INV;
    const shoulderA = (links[3].angle - links[2].angle) * DEG_INV;
    console.log(
      `[PHYS] spd=${skier.speed.toFixed(0)} pos=(${skier.x.toFixed(0)},${skier.y.toFixed(0)})` +
      ` ground=${skier.onGround ? 'Y' : 'N'} air=${skier.airTime.toFixed(2)}s` +
      ` slope=${(terrain.angle * DEG_INV).toFixed(1)}°` +
      ` | joints: ankle=${ankleA.toFixed(0)}° hip=${hipA.toFixed(0)}° shldr=${shoulderA.toFixed(0)}°` +
      ` | forces: ski=${Math.round(frameMaxSkiForce)} body=${Math.round(frameMaxForce)}(${frameMaxForceLink||'-'})` +
      ` | mouse=(${mouseX.toFixed(2)},${mouseY.toFixed(2)}) brake=${braking}`
    );
  }

  if (skier.onGround) {
    if (!wasOnGround && skier.airTime > 0.3) {
      // Landing
      detectTricks();
    }

    // Crash on hard body impact (checked continuously, matching original maxShock=13000)
    // Original uses accumulated force across all links; we use peak force per frame
    const impactThreshold = cfg.crashImpact * 100;
    if (frameMaxForce > impactThreshold) {
      skier.crashed = true;
      skier.crashTimer = 0;
      skier.crashReason = `${frameMaxForceLink} impact: ${Math.round(frameMaxForce)} (threshold: ${Math.round(impactThreshold)})`;
      if (frameMaxForce > impactThreshold * 3) {
        initExplosionRagdoll(); // extreme impact: scatter parts
      } else {
        initRagdoll(); // normal crash: connected ragdoll
      }
      SFX.playCrash();
      addCommentary('crashes');
      return;
    }

    // Ski binding detachment (original: MaxHzImpact/MaxDnImpact = 1300)
    if (!skiDetached && frameMaxSkiForce > cfg.bindingStrength * 150) {
      skiDetached = true;
      const skiLink = links[0];
      for (let i = 0; i < 2; i++) {
        detachedSkis.push({
          x: skiLink.pos.x,
          y: skiLink.pos.y,
          vx: skiLink.vel.x + (Math.random() - 0.5) * 150 + (i === 0 ? -60 : 60),
          vy: skiLink.vel.y - 80 - Math.random() * 120,
          angle: skiLink.angle + (Math.random() - 0.5) * 0.8,
          angVel: (Math.random() - 0.5) * 10,
          points: skiLink.points,
        });
      }
      // Switch foot link from ski polygon to boot polygon for ground contact
      // Ski is gone — foot should collide using boot shape, not invisible ski
      skiLink.points = skiLink.bootPts;
      skiLink.tag = 'foot'; // use body friction instead of ski friction
      SFX.playImpact(frameMaxSkiForce / 5);
      addCommentary('badLandings');
      setTimeout(() => {
        if (!skier.crashed && skiDetached) {
          skier.crashed = true;
          skier.crashTimer = 0;
          skier.crashReason = 'ski detachment';
          initRagdoll(); // connected ragdoll (not explosion)
          SFX.playCrash();
          addCommentary('crashes');
        }
      }, 400);
    }

    if (frameMaxSkiForce > 100) SFX.playImpact(frameMaxSkiForce / 10);
    skier.airTime = 0;
  } else {
    skier.airTime += dt;
    skier.totalAirTime += dt;
    skier.totalRotation += torsoLink.angVel * dt;
  }

  // Crash angle detection — REMOVED per original game analysis.
  // Original only crashes from force exceeding maxShock (13000).
  // Angle-based crash is not present in original.

  // Stats
  runStats.maxSpeed = Math.max(runStats.maxSpeed, skier.speed);
  runStats.maxAir = Math.max(runStats.maxAir, skier.airTime);
  runStats.distance = Math.max(runStats.distance, skier.x);

  // Sound
  SFX.updateWind(skier.speed);
  SFX.updateSki(skier.speed, skier.onGround, braking);
}


// ═══════════════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════════════
function updateParticles(dt) {
  // Snow spray (from ski ground contact, ~24px below ankle origin)
  const skiGroundY = skier.y + 24;
  if (skier.onGround && skier.speed > 80 && !skier.crashed) {
    const rate = Math.min(4, skier.speed / 150);
    for (let i = 0; i < rate; i++) {
      particles.push({
        x: skier.x - 10 - Math.random() * 12,
        y: skiGroundY + Math.random() * 3,
        vx: -skier.speed * 0.08 * Math.random() - 15,
        vy: -25 - Math.random() * 45,
        life: 0.4 + Math.random() * 0.4,
        size: 1 + Math.random() * 2.5,
        type: 'spray',
      });
    }
  }
  // Brake spray
  if (braking && skier.onGround && skier.speed > 20 && !skier.crashed) {
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: skier.x - 5 + Math.random() * 10,
        y: skiGroundY + Math.random() * 3,
        vx: -skier.speed * 0.25 * Math.random() - 20,
        vy: -40 - Math.random() * 70,
        life: 0.3 + Math.random() * 0.5,
        size: 1.5 + Math.random() * 3,
        type: 'brake',
      });
    }
  }
  // Crash burst
  if (skier.crashed && skier.crashTimer < 0.1) {
    for (let i = 0; i < 30; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 50 + Math.random() * 200;
      particles.push({
        x: skier.x, y: skier.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100,
        life: 0.5 + Math.random() * 1,
        size: 2 + Math.random() * 4,
        type: 'crash',
      });
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateDetachedSkis(dt) {
  for (let i = detachedSkis.length - 1; i >= 0; i--) {
    const s = detachedSkis[i];
    s.vy += cfg.gravity * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.angle += s.angVel * dt;
    // Ground collision using ski bottom contact points
    const cos = Math.cos(s.angle), sin = Math.sin(s.angle);
    let grounded = false;
    for (const pt of s.points) {
      if (pt.y < 20) continue; // only check bottom points (y≈23 in local)
      const wx = s.x + pt.x * cos - pt.y * sin;
      const wy = s.y + pt.x * sin + pt.y * cos;
      const t = getTerrainAt(wx);
      if (wy > t.y) {
        const pen = wy - t.y;
        s.y -= pen;
        s.vy *= -0.2;
        s.vx *= 0.95;
        s.angVel *= 0.8;
        grounded = true;
        break;
      }
    }
    if (grounded && Math.abs(s.vy) < 5) s.vy = 0;
    if (grounded && Math.abs(s.vx) < 3) s.vx = 0;
    s.vx *= 0.999;
    s.angVel *= 0.995;
  }
}

function updateSnowflakes(dt, camX, camY) {
  for (const s of snowflakes) {
    s.x += s.vx * dt + Math.sin(performance.now() / 1000 + s.phase) * 8 * dt;
    s.y += s.vy * dt;
    // Wrap around camera view
    if (s.x < camX - W) s.x += W * 3;
    if (s.x > camX + W * 2) s.x -= W * 3;
    if (s.y > camY + H) { s.y -= H * 2; s.x = camX + (Math.random() - 0.5) * W * 2; }
  }
}

// ═══════════════════════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════════════════════
function drawSky(camX, camY) {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#2a5599');
  skyGrad.addColorStop(0.3, '#4a90d9');
  skyGrad.addColorStop(0.6, '#87ceeb');
  skyGrad.addColorStop(1, '#c8e8ff');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Sun
  const sunX = W * 0.8, sunY = H * 0.12;
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 80);
  sunGrad.addColorStop(0, 'rgba(255,255,200,0.9)');
  sunGrad.addColorStop(0.3, 'rgba(255,240,180,0.3)');
  sunGrad.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sunGrad;
  ctx.fillRect(sunX - 80, sunY - 80, 160, 160);
}

function drawMountains(camX) {
  const layers = [
    { color: '#5a7aae', px: 0.03, yBase: H * 0.32, amp: 130, freq: 0.0006 },
    { color: '#7a9ac0', px: 0.06, yBase: H * 0.37, amp: 90, freq: 0.001 },
    { color: '#96b4d4', px: 0.1,  yBase: H * 0.42, amp: 55, freq: 0.002 },
  ];
  for (const l of layers) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 3) {
      const wx = x + camX * l.px;
      const my = l.yBase - l.amp * (
        Math.sin(wx * l.freq) +
        0.5 * Math.sin(wx * l.freq * 2.3 + 1) +
        0.25 * Math.sin(wx * l.freq * 4.7 + 3)
      );
      ctx.lineTo(x, my);
    }
    ctx.lineTo(W, H); ctx.closePath();
    ctx.fillStyle = l.color; ctx.fill();
    // Snow caps
    ctx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const wx = x + camX * l.px;
      const my = l.yBase - l.amp * (
        Math.sin(wx * l.freq) +
        0.5 * Math.sin(wx * l.freq * 2.3 + 1) +
        0.25 * Math.sin(wx * l.freq * 4.7 + 3)
      );
      if (x === 0) ctx.moveTo(x, my);
      else ctx.lineTo(x, my);
    }
    ctx.lineTo(W, H * 0.5); ctx.lineTo(0, H * 0.5); ctx.closePath();
    ctx.fillStyle = `rgba(240,248,255,0.15)`; ctx.fill();
  }
}

function drawTerrain(camX, camY) {
  ctx.beginPath();
  let first = true;
  for (const p of terrainPoints) {
    const sx = p.x - camX + W * 0.3;
    const sy = p.y - camY + H * 0.5;
    if (sx < -200 || sx > W + 200) continue;
    if (first) { ctx.moveTo(sx, sy); first = false; }
    else ctx.lineTo(sx, sy);
  }
  ctx.lineTo(W + 200, H + 100);
  ctx.lineTo(-200, H + 100);
  ctx.closePath();

  const snowGrad = ctx.createLinearGradient(0, H * 0.3, 0, H);
  snowGrad.addColorStop(0, '#eef3ff');
  snowGrad.addColorStop(0.3, '#e0e8f5');
  snowGrad.addColorStop(1, '#c0d0e8');
  ctx.fillStyle = snowGrad;
  ctx.fill();

  // Surface line with subtle shadow
  ctx.beginPath();
  first = true;
  for (const p of terrainPoints) {
    const sx = p.x - camX + W * 0.3;
    const sy = p.y - camY + H * 0.5;
    if (sx < -200 || sx > W + 200) continue;
    if (first) { ctx.moveTo(sx, sy); first = false; }
    else ctx.lineTo(sx, sy);
  }
  ctx.strokeStyle = 'rgba(180,195,215,0.8)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Ski tracks (trail behind skier on ground)
  if (!skier.crashed && skier.onGround) {
    ctx.beginPath();
    const trackStart = Math.max(0, skier.x - 400);
    for (let tx = trackStart; tx < skier.x; tx += 8) {
      const tt = getTerrainAt(tx);
      const tsx = tx - camX + W * 0.3;
      const tsy = tt.y - camY + H * 0.5;
      if (tsx < -10 || tsx > W + 10) continue;
      ctx.moveTo(tsx - 2, tsy);
      ctx.lineTo(tsx + 2, tsy);
    }
    ctx.strokeStyle = 'rgba(160,175,200,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawTrees(camX, camY) {
  for (const t of trees) {
    const sx = t.x - camX + W * 0.3;
    const sy = t.y - camY + H * 0.5;
    if (sx < -50 || sx > W + 50) continue;

    // Trunk
    ctx.fillStyle = '#4a3018';
    ctx.fillRect(sx - 2, sy - t.h, 4, t.h);

    // Foliage layers
    for (let j = 0; j < 3; j++) {
      const ly = sy - t.h + j * (t.h * 0.3);
      const lw = t.w + j * 4;
      ctx.beginPath();
      ctx.moveTo(sx, ly - 12);
      ctx.lineTo(sx - lw, ly + 8);
      ctx.lineTo(sx + lw, ly + 8);
      ctx.closePath();
      const g = 70 + j * 20 - t.shade * 25;
      ctx.fillStyle = `rgb(${15 + j * 10}, ${g}, ${25 + j * 8})`;
      ctx.fill();
    }

    // Snow cap
    ctx.beginPath();
    ctx.moveTo(sx, sy - t.h - 12);
    ctx.lineTo(sx - 7, sy - t.h + 3);
    ctx.lineTo(sx + 7, sy - t.h + 3);
    ctx.closePath();
    ctx.fillStyle = 'rgba(235,245,255,0.85)';
    ctx.fill();
  }
}

function drawParticles(camX, camY) {
  for (const p of particles) {
    const sx = p.x - camX + W * 0.3;
    const sy = p.y - camY + H * 0.5;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    ctx.beginPath();
    ctx.arc(sx, sy, p.size, 0, Math.PI * 2);
    const alpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.type === 'crash'
      ? `rgba(255,200,150,${alpha})`
      : `rgba(230,240,255,${alpha})`;
    ctx.fill();
  }
}

function drawSnowflakes(camX, camY) {
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (const s of snowflakes) {
    const sx = s.x - camX + W * 0.3;
    const sy = s.y - camY + H * 0.5;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ═══════════════════════════════════════════════════════════════
//  SKIER RENDERING (Articulated Figure)
// ═══════════════════════════════════════════════════════════════
function drawDetachedSkis(camX, camY) {
  const ox = -camX + W * 0.3;
  const oy = -camY + H * 0.5;
  for (const s of detachedSkis) {
    const sx = s.x + ox;
    const sy = s.y + oy;
    if (sx < -100 || sx > W + 100) continue;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(s.angle);
    drawThinSki(ctx, 23); // single thin ski per detached object
    ctx.restore();
  }
}

function drawSpeedLines(camX, camY) {
  if (skier.crashed || skier.speed < 200) return;
  const intensity = Math.min(1, (skier.speed - 200) / 600);
  const sx = skier.x - camX + W * 0.3;
  const sy = skier.y - camY + H * 0.5;
  ctx.save();
  ctx.globalAlpha = intensity * 0.5;
  ctx.strokeStyle = 'rgba(200,230,255,0.7)';
  ctx.lineWidth = 1;
  const numLines = Math.floor(3 + intensity * 8);
  const time = performance.now() / 1000;
  for (let i = 0; i < numLines; i++) {
    const seed = i * 137.5 + time * 3;
    const offsetY = (Math.sin(seed) * 25 + Math.cos(seed * 0.7) * 15);
    const offsetX = Math.sin(seed * 1.3) * 10;
    const lineLen = 15 + intensity * 30 + Math.sin(seed * 2.1) * 10;
    ctx.beginPath();
    ctx.moveTo(sx - 20 + offsetX, sy + offsetY);
    ctx.lineTo(sx - 20 + offsetX - lineLen, sy + offsetY + Math.random() * 2);
    ctx.stroke();
  }
  ctx.restore();
}

const LINK_COLORS = ['#1a1a4a', '#1a1a3a', '#cc3333', '#cc3333'];
const LINK_STROKES = ['#0a0a2a', '#111128', '#aa2222', '#aa2222'];

// Draw a single thin ski at a given vertical offset (in local coords)
function drawThinSki(ctxRef, yOffset) {
  // Ski runs from x≈-30 to x≈48, thin profile (3px tall)
  ctxRef.beginPath();
  ctxRef.moveTo(-25, yOffset + 1.5);      // rear
  ctxRef.quadraticCurveTo(-30, yOffset, -28, yOffset - 1.5); // rear tip curl
  ctxRef.lineTo(40, yOffset - 1.5);       // top edge
  ctxRef.quadraticCurveTo(48, yOffset - 2, 48, yOffset);     // front tip curl up
  ctxRef.quadraticCurveTo(48, yOffset + 1.5, 42, yOffset + 1.5); // front tip bottom
  ctxRef.lineTo(-25, yOffset + 1.5);      // bottom edge
  ctxRef.closePath();
  ctxRef.fillStyle = LINK_COLORS[0];
  ctxRef.fill();
  ctxRef.strokeStyle = LINK_STROKES[0];
  ctxRef.lineWidth = 0.8;
  ctxRef.stroke();
}

// Draw two parallel thin skis for a given position/angle
function drawSkiPair(posX, posY, angle, camX, camY) {
  const ox = -camX + W * 0.3;
  const oy = -camY + H * 0.5;
  ctx.save();
  ctx.translate(posX + ox, posY + oy);
  ctx.rotate(angle);
  // Two skis offset vertically (front ski slightly higher = perspective)
  drawThinSki(ctx, 21);   // back ski (lower)
  drawThinSki(ctx, 25);   // front ski (higher y = further down in screen)
  ctx.restore();
}

function drawLinkPolygon(link, camX, camY, colorIdx) {
  if (link.points.length < 2) return;
  const ox = -camX + W * 0.3;
  const oy = -camY + H * 0.5;

  ctx.save();
  ctx.translate(link.pos.x + ox, link.pos.y + oy);
  ctx.rotate(link.angle);

  ctx.beginPath();
  ctx.moveTo(link.points[0].x, link.points[0].y);
  for (let i = 1; i < link.points.length; i++) {
    ctx.lineTo(link.points[i].x, link.points[i].y);
  }
  ctx.closePath();
  ctx.fillStyle = LINK_COLORS[colorIdx];
  ctx.fill();
  ctx.strokeStyle = LINK_STROKES[colorIdx];
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function drawSkier(camX, camY) {
  if (skier.crashed) {
    drawRagdoll(camX, camY);
    const sx = skier.x - camX + W * 0.3;
    const sy = skier.y - camY + H * 0.5;
    ctx.save();
    ctx.font = 'bold 24px sans-serif';
    ctx.fillStyle = '#ff4444';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 4;
    ctx.fillText('CRASHED!', sx, sy - 70);
    ctx.font = '11px monospace';
    ctx.fillStyle = '#ffaa44';
    if (skier.crashReason) ctx.fillText(skier.crashReason, sx, sy - 52);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('Press R to restart · M for menu', sx, sy - 35);
    ctx.shadowBlur = 0;
    ctx.restore();
    return;
  }

  if (!links || links.length < 4) return;

  const ox = -camX + W * 0.3;
  const oy = -camY + H * 0.5;

  // Draw shadow on terrain surface below skier
  const skiLink = links[0];
  const terrain = getTerrainAt(skiLink.pos.x);
  const shadowX = skiLink.pos.x + ox;
  const shadowY = terrain.y + oy + 2;
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(shadowX, shadowY, 24, 3, terrain.angle, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Draw links back-to-front: skis, leg/thigh, boot (boot in front of thigh)
  if (!skiDetached) {
    drawSkiPair(links[0].pos.x, links[0].pos.y, links[0].angle, camX, camY); // two thin skis
  } else {
    // Draw boot stubs
    ctx.save();
    ctx.translate(links[0].pos.x + ox, links[0].pos.y + oy);
    ctx.rotate(links[0].angle);
    ctx.fillStyle = '#333';
    ctx.fillRect(-5, -3, 10, 6);
    ctx.restore();
  }
  drawLinkPolygon(links[1], camX, camY, 1); // leg/thigh (behind boot)
  // Draw boot/calf on foot link (in front of thigh)
  if (!skiDetached && links[0].bootPts) {
    const bootOx = -camX + W * 0.3;
    const bootOy = -camY + H * 0.5;
    ctx.save();
    ctx.translate(links[0].pos.x + bootOx, links[0].pos.y + bootOy);
    ctx.rotate(links[0].angle);
    ctx.beginPath();
    ctx.moveTo(links[0].bootPts[0].x, links[0].bootPts[0].y);
    for (let i = 1; i < links[0].bootPts.length; i++) {
      ctx.lineTo(links[0].bootPts[i].x, links[0].bootPts[i].y);
    }
    ctx.closePath();
    ctx.fillStyle = '#2a2a50';
    ctx.fill();
    ctx.strokeStyle = '#1a1a3a';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  drawLinkPolygon(links[2], camX, camY, 2); // torso
  drawLinkPolygon(links[3], camX, camY, 3); // arms (in front of torso per original)

  // Draw head (circle at top of torso)
  const torsoLink = links[2];
  const headLocal = {x: 5, y: -33}; // head center from original torso polygon head points
  const headWorld = worldPoint(torsoLink, headLocal);
  ctx.save();
  ctx.beginPath();
  ctx.arc(headWorld.x + ox, headWorld.y + oy, 7, 0, Math.PI * 2);
  ctx.fillStyle = '#2255aa';
  ctx.fill();
  ctx.strokeStyle = '#1a3a7a';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Goggles
  const gogX = headWorld.x + ox + 6 * Math.cos(torsoLink.angle);
  const gogY = headWorld.y + oy + 6 * Math.sin(torsoLink.angle);
  ctx.beginPath();
  ctx.ellipse(gogX, gogY, 4.5, 2.8, torsoLink.angle, 0, Math.PI * 2);
  ctx.fillStyle = '#ffaa00';
  ctx.fill();
  ctx.restore();

  // Debug: draw joint positions
  if (debugJoints) {
    ctx.save();
    for (let i = 0; i < 3; i++) {
      const jp = getJointWorldPos(i);
      ctx.beginPath();
      ctx.arc(jp.x + ox, jp.y + oy, 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,0,0.8)';
      ctx.fill();
      ctx.strokeStyle = '#ff0';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // Draw link centers
    for (const link of links) {
      ctx.beginPath();
      ctx.arc(link.pos.x + ox, link.pos.y + oy, 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,255,0,0.8)';
      ctx.fill();
    }
    ctx.restore();
  }

  // Brake spray effect
  if (braking && skier.onGround && skier.speed > 30) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.6, skier.speed / 400);
    for (let i = 0; i < 10; i++) {
      const px = skiLink.pos.x + ox - 10 + Math.random() * 20;
      const py = skiLink.pos.y + oy + Math.random() * 4;
      ctx.beginPath();
      ctx.arc(px - skier.speed * 0.015 * Math.random(), py - Math.random() * 12, 1 + Math.random() * 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(220,235,255,0.7)';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}


// ═══════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════
let cam = { x: 0, y: 0, shake: 0 };

function updateCamera(dt) {
  // Look-ahead based on velocity
  const lookAheadX = skier.vx * 0.3;
  const lookAheadY = skier.vy * 0.15 - 60;
  const targetX = skier.x + lookAheadX;
  const targetY = skier.y + lookAheadY;

  cam.x += (targetX - cam.x) * 4 * dt;
  cam.y += (targetY - cam.y) * 4 * dt;

  // Shake decay
  cam.shake *= Math.pow(0.05, dt);

  // Add shake on hard landings or crashes
  if (skier.crashed && skier.crashTimer < 0.1) cam.shake = 15;
}

function getCamOffset() {
  const shakeX = (Math.random() - 0.5) * cam.shake * 2;
  const shakeY = (Math.random() - 0.5) * cam.shake * 2;
  return { x: cam.x + shakeX, y: cam.y + shakeY };
}

// ═══════════════════════════════════════════════════════════════
//  VICTORY SYSTEM
// ═══════════════════════════════════════════════════════════════
function hideVictory() {
  document.getElementById('victory-overlay').classList.remove('visible');
}

function showVictory() {
  if (victoryShown) return;
  victoryShown = true;
  gameState = 'victory';

  const scen = SCENARIOS[selectedScenario];
  const v = scen.victory;
  const noCrash = !skier.crashed;
  let finalScore = score.total;
  const noCrashBonus = noCrash ? Math.floor(finalScore * 0.25) : 0;
  const timeBonus = Math.max(0, Math.floor(300 - runTimer * 3));
  finalScore += noCrashBonus + timeBonus;

  let medal = '🥉', medalName = 'Bronze';
  if (finalScore >= v.goldScore) { medal = '🥇'; medalName = 'Gold'; }
  else if (finalScore >= v.silverScore) { medal = '🥈'; medalName = 'Silver'; }

  // Save best score
  const key = `ski_best_${scen.id}`;
  let prev = 0;
  try { prev = parseInt(localStorage.getItem(key) || '0'); } catch(e) {}
  const isNewBest = finalScore > prev;
  if (isNewBest) try { localStorage.setItem(key, finalScore); } catch(e) {}

  const box = document.getElementById('victory-box');
  box.innerHTML = `
    <h2>🏁 RUN COMPLETE!</h2>
    <div class="medal">${medal}</div>
    <div style="font-size:18px;color:#ccc;margin-bottom:2px">${medalName} Medal — ${scen.name}</div>
    <div class="stats-grid">
      <span class="label">Trick Score</span><span class="value">${score.total}</span>
      <span class="label">No-Crash Bonus</span><span class="value">${noCrash ? '+' + noCrashBonus : '—'}</span>
      <span class="label">Time Bonus</span><span class="value">+${timeBonus}</span>
      <span class="label" style="color:#ffd700;font-weight:bold">Final Score</span><span class="value" style="color:#ffd700;font-weight:bold">${finalScore}</span>
      <span class="label">Time</span><span class="value">${runTimer.toFixed(1)}s</span>
      <span class="label">Max Speed</span><span class="value">${(runStats.maxSpeed * 0.15).toFixed(0)} km/h</span>
      <span class="label">Best Air</span><span class="value">${runStats.maxAir.toFixed(1)}s</span>
      <span class="label">Tricks Landed</span><span class="value">${runStats.jumps}</span>
      ${isNewBest ? '<span class="label" style="color:#ff6">★ NEW BEST!</span><span class="value" style="color:#ff6">was ' + prev + '</span>' : ''}
    </div>
    <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:4px">
      Goal: ${v.scoreGoal} · Silver: ${v.silverScore} · Gold: ${v.goldScore}
    </div>
    <div class="btn-row">
      <button class="btn-retry" onclick="startGame(selectedScenario)">↻ Retry</button>
      <button class="btn-menu" onclick="hideVictory();showMenu()">☰ Menu</button>
    </div>`;
  document.getElementById('victory-overlay').classList.add('visible');

  SFX.init();
  // Victory fanfare
  if (SFX.ctx) {
    const t = SFX.ctx.currentTime;
    const notes = [523, 659, 784, 1047, 1319];
    for (let i = 0; i < notes.length; i++) {
      const osc = SFX.ctx.createOscillator();
      const g = SFX.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = notes[i];
      g.gain.setValueAtTime(0.15, t + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.5);
      osc.connect(g); g.connect(SFX.master);
      osc.start(t + i * 0.12); osc.stop(t + i * 0.12 + 0.5);
    }
  }
}

function checkVictory() {
  if (victoryShown || skier.crashed) return;
  if (skier.x >= finishX && skier.onGround) {
    showVictory();
  }
}

// ═══════════════════════════════════════════════════════════════
//  MINIMAP
// ═══════════════════════════════════════════════════════════════
const minimapCanvas = document.getElementById('minimap');
const mctx = minimapCanvas.getContext('2d');
const MW = 220, MH = 60;

function drawMinimap() {
  mctx.clearRect(0, 0, MW, MH);
  if (terrainPoints.length < 2) return;

  // Background
  mctx.fillStyle = 'rgba(0,10,30,0.7)';
  mctx.beginPath();
  mctx.roundRect(0, 0, MW, MH, 6);
  mctx.fill();
  mctx.strokeStyle = 'rgba(255,255,255,0.15)';
  mctx.lineWidth = 1;
  mctx.stroke();

  const firstPt = terrainPoints[0];
  const lastPt = terrainPoints[terrainPoints.length - 1];
  const totalX = lastPt.x - firstPt.x;
  // Find y extents
  let minY = Infinity, maxY = -Infinity;
  for (const p of terrainPoints) {
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }
  const pad = 8;
  const drawW = MW - pad * 2;
  const drawH = MH - pad * 2;
  const rangeY = maxY - minY || 1;

  // Draw terrain profile
  mctx.beginPath();
  let first = true;
  for (const p of terrainPoints) {
    const mx = pad + ((p.x - firstPt.x) / totalX) * drawW;
    const my = pad + ((p.y - minY) / rangeY) * drawH;
    if (first) { mctx.moveTo(mx, my); first = false; }
    else mctx.lineTo(mx, my);
  }
  // Fill below terrain
  mctx.lineTo(pad + drawW, pad + drawH);
  mctx.lineTo(pad, pad + drawH);
  mctx.closePath();
  mctx.fillStyle = 'rgba(200,220,240,0.15)';
  mctx.fill();
  // Terrain line
  mctx.beginPath();
  first = true;
  for (const p of terrainPoints) {
    const mx = pad + ((p.x - firstPt.x) / totalX) * drawW;
    const my = pad + ((p.y - minY) / rangeY) * drawH;
    if (first) { mctx.moveTo(mx, my); first = false; }
    else mctx.lineTo(mx, my);
  }
  mctx.strokeStyle = 'rgba(200,220,240,0.5)';
  mctx.lineWidth = 1;
  mctx.stroke();

  // Finish line
  const finishMx = pad + ((finishX - firstPt.x) / totalX) * drawW;
  mctx.beginPath();
  mctx.moveTo(finishMx, pad);
  mctx.lineTo(finishMx, pad + drawH);
  mctx.strokeStyle = 'rgba(255,215,0,0.6)';
  mctx.lineWidth = 1.5;
  mctx.setLineDash([3, 3]);
  mctx.stroke();
  mctx.setLineDash([]);
  // Flag icon
  mctx.fillStyle = '#ffd700';
  mctx.font = '10px sans-serif';
  mctx.fillText('🏁', finishMx - 5, pad + 3);

  // Skier position dot
  const skierFrac = Math.max(0, Math.min(1, (skier.x - firstPt.x) / totalX));
  const skierTerrain = getTerrainAt(skier.x);
  const smx = pad + skierFrac * drawW;
  const smy = pad + ((skierTerrain.y - minY) / rangeY) * drawH;

  // Trail (last portion traversed)
  const trailStartFrac = Math.max(0, skierFrac - 0.01);
  mctx.beginPath();
  let trailFirst = true;
  for (const p of terrainPoints) {
    const frac = (p.x - firstPt.x) / totalX;
    if (frac < trailStartFrac || frac > skierFrac) continue;
    const mx = pad + frac * drawW;
    const my = pad + ((p.y - minY) / rangeY) * drawH;
    if (trailFirst) { mctx.moveTo(mx, my); trailFirst = false; }
    else mctx.lineTo(mx, my);
  }

  // Skier dot (pulsing)
  const pulse = 1 + Math.sin(performance.now() / 200) * 0.3;
  mctx.beginPath();
  mctx.arc(smx, smy - 2, 3 * pulse, 0, Math.PI * 2);
  mctx.fillStyle = skier.crashed ? '#ff4444' : '#4af';
  mctx.fill();
  mctx.strokeStyle = '#fff';
  mctx.lineWidth = 0.8;
  mctx.stroke();

  // Progress percentage
  const pct = Math.min(100, (skierFrac / ((finishX - firstPt.x) / totalX) * 100)).toFixed(0);
  mctx.fillStyle = 'rgba(255,255,255,0.6)';
  mctx.font = '9px monospace';
  mctx.textAlign = 'right';
  mctx.fillText(`${pct}%`, MW - pad, MH - 2);
  mctx.textAlign = 'left';
}

// ═══════════════════════════════════════════════════════════════
//  FINISH LINE RENDERING
// ═══════════════════════════════════════════════════════════════
function drawFinishLine(camX, camY) {
  const sx = finishX - camX + W * 0.3;
  if (sx < -50 || sx > W + 50) return;
  const terrain = getTerrainAt(finishX);
  const sy = terrain.y - camY + H * 0.5;

  // Pole
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx, sy - 80);
  ctx.stroke();

  // Checkered banner
  const bannerW = 30, bannerH = 20;
  const bx = sx, by = sy - 80;
  const cellSize = 5;
  for (let row = 0; row < bannerH / cellSize; row++) {
    for (let col = 0; col < bannerW / cellSize; col++) {
      ctx.fillStyle = (row + col) % 2 === 0 ? '#111' : '#fff';
      ctx.fillRect(bx + col * cellSize, by + row * cellSize, cellSize, cellSize);
    }
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bannerW, bannerH);

  // "FINISH" text
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 3;
  ctx.fillText('FINISH', sx + bannerW / 2, by - 4);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}
function updateHUD() {
  const speedKmh = (skier.speed * 0.15).toFixed(0);
  const dist = (runStats.distance * 0.05).toFixed(0);

  let hudHTML = `Speed: ${speedKmh} km/h<br>Distance: ${dist}m<br>Time: ${runTimer.toFixed(1)}s`;
  if (braking && skier.onGround) hudHTML += '<br><span style="color:#ff6">⛷ BRAKING</span>';
  if (!skier.onGround && !skier.crashed) {
    hudHTML += `<br><span style="color:#6ff">🦅 AIR ${skier.airTime.toFixed(1)}s</span>`;
    const flips = Math.abs(skier.totalRotation) / (Math.PI * 2);
    const fullFlips = Math.floor(flips);
    const direction = skier.totalRotation > 0 ? 'F' : 'B';
    if (flips > 0.3) {
      const flipColor = fullFlips >= 2 ? '#ff0' : fullFlips >= 1 ? '#f6f' : '#f6f';
      hudHTML += `<br><span style="color:${flipColor};font-size:16px;font-weight:bold">`;
      hudHTML += `↻ ${fullFlips > 0 ? fullFlips + direction + ' ' : ''}${(flips * 360).toFixed(0)}°</span>`;
    }
    // Projected score
    const projScore = Math.floor(skier.airTime * cfg.airtimePoints * 10 + fullFlips * cfg.flipPoints);
    if (projScore > 10) {
      hudHTML += `<br><span style="color:#aaf;font-size:11px">~${projScore} pts</span>`;
    }
  }
  if (skiDetached) {
    hudHTML += `<br><span style="color:#f44">⚠ SKIS DETACHED!</span>`;
  }
  hudEl.innerHTML = hudHTML;

  // Score display
  const comboStr = score.combo > 1 ? ` <span style="color:#ff6">×${score.combo.toFixed(1)}</span>` : '';
  scoreEl.innerHTML = `Score: ${score.total}${comboStr}<br>Jumps: ${runStats.jumps} · Flips: ${runStats.totalFlips}`;

  // Goal HUD
  const scen = SCENARIOS[selectedScenario];
  const v = scen.victory;
  const goalHud = document.getElementById('goal-hud');
  const pctDone = Math.min(100, (skier.x / finishX * 100)).toFixed(0);
  let goalColor = '#aaa';
  if (score.total >= v.goldScore) goalColor = '#ffd700';
  else if (score.total >= v.silverScore) goalColor = '#c0c0c0';
  else if (score.total >= v.scoreGoal) goalColor = '#cd7f32';
  goalHud.innerHTML = `<span style="color:${goalColor}">🏁 ${pctDone}% — Score: ${score.total} / ${v.goldScore} 🥇</span>`;

  // Trick messages
  let trickHTML = '';
  for (let i = trickMessages.length - 1; i >= 0; i--) {
    const m = trickMessages[i];
    m.life -= 1 / 60;
    m.y -= 0.5;
    if (m.life <= 0) { trickMessages.splice(i, 1); continue; }
    const alpha = Math.min(1, m.life);
    const scale = m.life > 2 ? 1.2 : 1;
    // Color based on landing quality
    let textColor = '#ffd700';
    if (m.landingQuality === 'perfect') textColor = '#44ffaa';
    else if (m.landingQuality === 'smooth') textColor = '#88ddff';
    else if (m.landingQuality === 'hard') textColor = '#ff8844';
    else if (m.landingQuality === 'hint') textColor = '#aaccff';
    const fontSize = m.landingQuality === 'hint' ? 13 : 16 + Math.min(m.score * 0.05, 10);
    trickHTML += `<div style="opacity:${alpha};transform:translateY(${m.y}px) scale(${scale});margin:4px 0">` +
      `<span style="color:${textColor};font:bold ${fontSize}px sans-serif;text-shadow:2px 2px 4px rgba(0,0,0,0.7)">${m.text}</span>` +
      (m.score > 0 ? `<span style="color:#fff;font:bold 14px sans-serif;margin-left:8px">+${m.score}</span>` : '') +
      (m.combo > 1 ? `<span style="color:#ff6;font:12px sans-serif;margin-left:4px">×${m.combo.toFixed(1)}</span>` : '') +
      `</div>`;
  }
  trickEl.innerHTML = trickHTML;

  instrEl.innerHTML = gameState === 'playing' && !skier.crashed
    ? 'Mouse: posture · Click: brake · Space: jump · R: restart · Esc: pause'
    : '';
}

// ═══════════════════════════════════════════════════════════════
//  COMMENTARY & TRAINING HINTS
// ═══════════════════════════════════════════════════════════════
function updateCommentary(dt) {
  for (let i = commentaryMessages.length - 1; i >= 0; i--) {
    const m = commentaryMessages[i];
    m.life -= dt;
    m.y += m.vy * dt;
    if (m.life <= 0) commentaryMessages.splice(i, 1);
  }
}

function drawCommentary() {
  const sx = skier.x - cam.x + W * 0.3;
  const sy = skier.y - cam.y + H * 0.5;
  for (const m of commentaryMessages) {
    const alpha = Math.min(1, m.life);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${Math.floor(18 * m.scale)}px sans-serif`;
    ctx.fillStyle = m.color;
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 4;
    ctx.fillText(m.text, sx + m.x, sy + m.y);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

function updateTrainingHints(dt) {
  if (!trainingHints) return;
  for (const hint of trainingHints) {
    if (!hint.shown && runTimer >= hint.triggerTime) {
      hint.shown = true;
      trickMessages.push({
        text: hint.text,
        score: 0,
        combo: 1,
        life: 4.0,
        y: 60,
        landingQuality: 'hint',
      });
    }
  }
}

// ═══════════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════════
let lastTime = 0;

function gameLoop(time) {
  const rawDt = (time - lastTime) / 1000;
  lastTime = time;
  const dt = Math.min(rawDt, 0.05);

  if (gameState === 'playing' && !paused) {
    if (!skier.crashed) runTimer += dt;
    updatePhysics(dt);
    updateDetachedSkis(dt);
    updateParticles(dt);
    updateCamera(dt);
    checkVictory();
    const c = getCamOffset();
    updateSnowflakes(dt, c.x, c.y);

    // Draw
    drawSky(c.x, c.y);
    drawMountains(c.x);
    drawTerrain(c.x, c.y);
    drawFinishLine(c.x, c.y);
    drawTrees(c.x, c.y);
    drawSnowflakes(c.x, c.y);
    drawParticles(c.x, c.y);
    drawDetachedSkis(c.x, c.y);
    drawSpeedLines(c.x, c.y);
    drawSkier(c.x, c.y);
    drawMinimap();
    updateCommentary(dt);
    drawCommentary();
    updateTrainingHints(dt);
    updateHUD();
  } else if (gameState === 'victory') {
    // Keep rendering the scene behind the victory overlay
    updateCamera(dt);
    const c = getCamOffset();
    drawSky(c.x, c.y);
    drawMountains(c.x);
    drawTerrain(c.x, c.y);
    drawFinishLine(c.x, c.y);
    drawTrees(c.x, c.y);
    drawSnowflakes(c.x, c.y);
    drawSkier(c.x, c.y);
    drawMinimap();
  } else if (gameState === 'menu') {
    const t = time / 1000;
    drawSky(t * 20, 0);
    drawMountains(t * 20);
  }

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
