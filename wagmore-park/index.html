<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wagmore Park</title>
<meta name="description" content="An interactive off-leash dog park: throw the ball, toss treats, whistle, and pet the dogs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: the park fills the window; a toolbar floats top-left over the outer lawn, the dog roster docks right (bottom drawer on phones). One daylit look; time of day is painted in the scene itself. */
:root {
  --lawn: #77a656;
  --panel: rgba(250, 253, 246, 0.95);
  --ink: #22301d;
  --muted: #5d6b55;
  --line: rgba(34, 48, 29, 0.14);
  --leash: #2d6be0;
  --energy: #f0a531;
  --happy: #e2577a;
  --f-display: 'Fredoka', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gutter: 16px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { overflow: hidden; background: var(--lawn); color: var(--ink); font: 14px/1.4 var(--f-body); }
canvas#park { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--leash); outline-offset: 2px; }

/* ---------- toolbar ---------- */
.bar {
  position: fixed;
  top: calc(var(--gutter) + env(safe-area-inset-top, 0px));
  left: var(--gutter);
  right: calc(300px + 2 * var(--gutter));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 10px 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 6px 24px rgba(30, 50, 20, 0.18);
}
.brand { display: flex; flex-direction: column; margin-right: auto; }
.brand h1 { margin: 0; font: 600 24px/1 var(--f-display); letter-spacing: 0.01em; color: #2e5a24; }
.brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: rgba(34, 48, 29, 0.06); border-radius: 12px; }
.seg button {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border: 0; border-radius: 9px; background: transparent;
  font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap;
}
.seg button:hover { color: var(--ink); background: rgba(255, 255, 255, 0.6); }
.seg button[aria-checked="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(30, 50, 20, 0.2); }
.seg svg { width: 18px; height: 18px; flex: none; }
.seg kbd { font: 600 10px/1 var(--f-body); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
.plain-btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 600; font-size: 13px; }
.plain-btn[aria-pressed="true"] { border-color: var(--leash); color: var(--leash); }

.hint {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--gutter) + 6px + env(safe-area-inset-bottom, 0px));
  margin: 0; padding: 7px 14px; max-width: calc(100vw - 2 * var(--gutter));
  background: rgba(34, 48, 29, 0.78); color: #f4fbef; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; text-align: center; pointer-events: none;
}

/* ---------- roster ---------- */
.roster {
  position: fixed;
  top: calc(var(--gutter) + env(safe-area-inset-top, 0px));
  right: var(--gutter);
  bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px));
  width: 300px;
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 6px 24px rgba(30, 50, 20, 0.18);
  overflow: hidden;
}
.roster-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.roster-head h2 { margin: 0; font: 600 18px/1.1 var(--f-display); flex: 1; }
.roster-head h2 span { display: inline-block; min-width: 22px; padding: 2px 7px; margin-left: 4px; font: 600 12px/1.2 var(--f-body); color: #fff; background: #4f8a3a; border-radius: 999px; text-align: center; vertical-align: 2px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--leash); margin: 0; }
#drawer { display: none; }

.dogs { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.dog { border: 1px solid transparent; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 7px; }
.dog:hover { background: rgba(34, 48, 29, 0.04); }
.dog.sel { border-color: var(--leash); background: rgba(45, 107, 224, 0.06); }
.dog-main { display: flex; align-items: center; gap: 10px; padding: 0; border: 0; background: none; text-align: left; width: 100%; }
.portrait { width: 64px; height: 46px; flex: none; border-radius: 9px; background: linear-gradient(#cfe7b8, #a8cf88); }
.who { display: flex; flex-direction: column; min-width: 0; }
.who strong { font: 600 15px/1.2 var(--f-display); }
.who .breed { font-size: 12px; color: var(--muted); }
.who .doing { font-size: 12px; font-weight: 700; color: #3f7a2c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.meter { display: flex; flex-direction: column; gap: 3px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.meter i { display: block; height: 6px; border-radius: 3px; background: rgba(34, 48, 29, 0.1); overflow: hidden; position: relative; }
.meter i::after { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--v, 50%); background: var(--c); border-radius: 3px; transition: width 0.3s; }
.acts { display: flex; gap: 6px; }
.acts button { flex: 1; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 12px; font-weight: 700; color: var(--ink); }
.acts button:hover { border-color: rgba(34, 48, 29, 0.3); }
.acts button:disabled { opacity: 0.5; cursor: default; }

.adopt { padding: 12px 14px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.adopt label { font: 600 14px/1.2 var(--f-display); }
.adopt .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.adopt select, .adopt input { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 13px; }
.adopt .go { grid-column: 1 / -1; padding: 8px; border: 0; border-radius: 10px; background: var(--leash); color: #fff; font-weight: 700; }
.adopt .go:disabled { background: #9db5df; cursor: default; }
.adopt .note { margin: 0; font-size: 12px; color: var(--muted); min-height: 1em; }

@media (max-width: 900px) {
  .bar { right: var(--gutter); padding: 8px 10px; gap: 8px 10px; }
  .brand h1 { font-size: 20px; }
  .brand p { display: none; }
  .seg button { padding: 6px 8px; font-size: 12px; }
  .seg kbd { display: none; }
  .roster { top: auto; left: var(--gutter); width: auto; max-height: 58%; }
  .roster.closed .dogs, .roster.closed .adopt { display: none; }
  .roster.closed .roster-head { border-bottom: 0; }
  #drawer { display: inline-block; }
  .hint { display: none; }
}
@media (max-width: 520px) { .seg .lbl { display: none; } .seg button { padding: 7px 9px; } }
@media (prefers-reduced-motion: reduce) { .meter i::after { transition: none; } }
</style>
</head>
<body>
<canvas id="park" aria-label="Dog park. Drag on the grass to throw a ball; press and hold a dog to pet it."></canvas>

<header class="bar" id="bar">
  <div class="brand">
    <h1>Wagmore Park</h1>
    <p>Off-leash area · open dawn to dusk</p>
  </div>
  <div class="seg" role="radiogroup" aria-label="What a click on the grass does">
    <button type="button" role="radio" id="tool-ball" data-tool="ball" aria-checked="true">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#d6ec3f" stroke="#9fb52a" stroke-width="1"/><path d="M3.5 6.5c3 1.5 3 5.5 0 7M16.5 6.5c-3 1.5-3 5.5 0 7" fill="none" stroke="#fff" stroke-width="1.6"/></svg>
      <span class="lbl">Throw ball</span><kbd>1</kbd></button>
    <button type="button" role="radio" id="tool-treat" data-tool="treat" aria-checked="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><g fill="#c98a4b"><circle cx="4.5" cy="7.5" r="2.6"/><circle cx="4.5" cy="12.5" r="2.6"/><circle cx="15.5" cy="7.5" r="2.6"/><circle cx="15.5" cy="12.5" r="2.6"/><rect x="4.5" y="7.6" width="11" height="4.8" rx="1.5"/></g></svg>
      <span class="lbl">Toss treat</span><kbd>2</kbd></button>
    <button type="button" role="radio" id="tool-whistle" data-tool="whistle" aria-checked="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="7" width="10" height="7" rx="3.5" fill="#8a96a3"/><circle cx="12" cy="11" r="5" fill="#a9b4bf"/><circle cx="12" cy="11" r="1.8" fill="#4d5966"/><path d="M14 4l3-2M16 6.5l3 -0.5" stroke="#4d5966" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="lbl">Whistle</span><kbd>3</kbd></button>
  </div>
  <div class="seg" role="radiogroup" aria-label="Time of day" id="times">
    <button type="button" role="radio" id="time-morning" data-time="morning" aria-checked="false">Morning</button>
    <button type="button" role="radio" id="time-noon" data-time="noon" aria-checked="true">Noon</button>
    <button type="button" role="radio" id="time-golden" data-time="golden" aria-checked="false">Golden hour</button>
    <button type="button" role="radio" id="time-night" data-time="night" aria-checked="false">Night</button>
  </div>
  <button type="button" class="plain-btn" id="sound" aria-pressed="false">Sound off</button>
</header>

<p class="hint" id="hint">Drag across the grass to throw the ball. Press and hold a dog to pet it.</p>

<aside class="roster" id="roster">
  <div class="roster-head">
    <h2>In the park<span id="count">0</span></h2>
    <label class="toggle" for="names"><input type="checkbox" id="names">Name tags</label>
    <button type="button" class="plain-btn" id="drawer" aria-expanded="true" aria-controls="dogs">Hide</button>
  </div>
  <ul class="dogs" id="dogs"></ul>
  <form class="adopt" id="adopt">
    <label for="breed">Let a dog in</label>
    <div class="row">
      <select id="breed"></select>
      <input id="dogname" maxlength="16" placeholder="Name (optional)" autocomplete="off">
      <button type="submit" class="go" id="go">Open the gate</button>
    </div>
    <p class="note" id="note"></p>
  </form>
</aside>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, k) => v + (t - v) * k;

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

/* ================= breeds ================= */
const BREEDS = {
  golden:    { name: 'Golden Retriever', coat: '#e3a94f', belly: '#f2cf8e', muzzle: '#efc27a', paw: '#e9b867', ear: '#c98a36', earType: 'floppy', earLen: 1.05, tail: 'feather', tailTip: '#f2cf8e', tailLen: 22, tailW: 5, len: 52, h: 22, leg: 17, legW: 6.5, headR: 11.5, snout: 9, size: 1.15, speed: 1.05, fetch: 0.95, barks: ['Woof!', 'Boof!'] },
  corgi:     { name: 'Corgi', coat: '#e8913a', belly: '#fff6ea', muzzle: '#fff6ea', paw: '#fff6ea', chest: '#fff6ea', ear: '#e8913a', earType: 'pointy', tail: 'stub', len: 48, h: 21, leg: 7, legW: 6, headR: 11, snout: 8, size: 0.85, speed: 0.9, fetch: 0.8, barks: ['Arf!', 'Yap!'] },
  dalmatian: { name: 'Dalmatian', coat: '#fafaf5', belly: '#f1f1ea', muzzle: '#fafaf5', paw: '#ecebe3', ear: '#2a2a2a', earType: 'floppy', earLen: 0.9, tail: 'long', tailLen: 22, tailW: 3.5, spots: 15, len: 50, h: 19, leg: 20, legW: 5.5, headR: 10.5, snout: 10, size: 1.1, speed: 1.15, fetch: 0.75, barks: ['Woof!'] },
  dachshund: { name: 'Dachshund', coat: '#8b4a25', belly: '#a9643a', muzzle: '#a35c33', paw: '#7a3f1f', ear: '#6a3318', earType: 'floppy', earLen: 1.35, tail: 'long', tailLen: 18, tailW: 3.5, len: 60, h: 16, leg: 6, legW: 5, headR: 9.5, snout: 11, size: 0.8, speed: 0.85, fetch: 0.6, barks: ['Yip!', 'Arf!'] },
  husky:     { name: 'Siberian Husky', coat: '#76808f', belly: '#f4f5f7', muzzle: '#f4f5f7', paw: '#f4f5f7', mask: '#f4f5f7', saddle: '#4c5462', ear: '#5d6674', earType: 'pointy', tail: 'curl', len: 52, h: 21, leg: 18, legW: 6, headR: 11.5, snout: 9, size: 1.1, speed: 1.2, fetch: 0.55, barks: ['Awoo!', 'Woo-woo!'] },
  poodle:    { name: 'Poodle', coat: '#e7c29a', belly: '#efd0ad', muzzle: '#efd3b3', paw: '#e7c29a', ear: '#d9ae82', earType: 'floppy', earLen: 1.1, fluffy: true, tail: 'pom', len: 44, h: 22, leg: 20, legW: 5, headR: 11, snout: 9, size: 1, speed: 1, fetch: 0.7, barks: ['Arf!'] },
  pug:       { name: 'Pug', coat: '#dcbd8e', belly: '#e6cba2', muzzle: '#2e2622', paw: '#dcbd8e', ear: '#2e2622', earType: 'tiny', tail: 'curl', len: 38, h: 21, leg: 9, legW: 6, headR: 11.5, snout: 2, size: 0.75, speed: 0.8, fetch: 0.35, barks: ['Snort!', 'Yip!'] },
  collie:    { name: 'Border Collie', coat: '#26262b', belly: '#f7f7f4', muzzle: '#f7f7f4', paw: '#f7f7f4', chest: '#f7f7f4', blaze: '#f7f7f4', ear: '#26262b', earType: 'floppy', earLen: 0.7, tail: 'feather', tailTip: '#f7f7f4', tailLen: 22, tailW: 5, len: 50, h: 20, leg: 17, legW: 5.5, headR: 10.5, snout: 10, size: 1.05, speed: 1.25, fetch: 1, barks: ['Woof!'] },
};
for (const b of Object.values(BREEDS)) b.coatDark = shade(b.coat, b.coat === '#26262b' ? 0.12 : -0.2);

const NAMES = ['Biscuit', 'Mochi', 'Pepper', 'Juniper', 'Waffles', 'Noodle', 'Olive', 'Banjo', 'Maple', 'Ziggy', 'Pickles', 'Luna', 'Hank', 'Clementine', 'Bruno', 'Pippin', 'Tater', 'Rosie', 'Gus', 'Hazel', 'Otis', 'Fig', 'Scout', 'Toast'];
const MAX_DOGS = 14;

/* ================= world ================= */
const cv = document.getElementById('park'), ctx = cv.getContext('2d');
const bg = document.createElement('canvas'), bctx = bg.getContext('2d');
let W = 0, H = 0, DPR = 1, K = 1;
const park = { x: 0, y: 0, w: 1, h: 1 };
const F = {}; // features: tree, bench, hydrant, bowl, lamp, gate, flowers[]
let dogs = [], balls = [], treats = [], parts = [];
let time = 0, uid = 0;
const S = { tool: 'ball', tod: 'noon', sound: false, names: false };
let selected = null, hovered = null;

const bounds = () => ({ x0: park.x + 22 * K, x1: park.x + park.w - 22 * K, y0: park.y + 30 * K, y1: park.y + park.h - 10 * K });
const inPark = (x, y) => { const b = bounds(); return { x: clamp(x, b.x0, b.x1), y: clamp(y, b.y0, b.y1) }; };
const rp = (u, v) => ({ x: park.x + u * park.w, y: park.y + v * park.h });

function layout() {
  const old = { ...park };
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  bg.width = cv.width; bg.height = cv.height;
  const g = 16;
  const bar = document.getElementById('bar').getBoundingClientRect();
  const ros = document.getElementById('roster').getBoundingClientRect();
  const wide = W > 900;
  const fenceTop = 30;
  park.x = g + 8;
  park.y = bar.bottom + fenceTop + 6;
  park.w = (wide ? ros.left - g : W - g) - 8 - park.x;
  const bottom = wide ? H - g - 8 : (rosterClosed() ? ros.top : H - 120) - 14;
  park.h = Math.max(160, bottom - park.y);
  K = clamp(Math.min(park.w, park.h * 1.4) / 760, 0.62, 1.25);

  F.tree = rp(0.22, 0.42);
  F.bench = rp(0.56, 0.1);
  F.hydrant = rp(0.74, 0.4);
  F.bowl = rp(0.86, 0.78);
  F.lamp = rp(0.42, 0.74);
  F.gate = { x: park.x, y: park.y + park.h * 0.62 };
  F.flowers = [rp(0.05, 0.12), rp(0.95, 0.1), rp(0.6, 0.93), rp(0.3, 0.95), rp(0.95, 0.5)];
  F.bench.y = Math.max(F.bench.y, park.y + 46 * K);

  if (old.w > 1) { // keep everyone where they were, proportionally
    const mv = o => { o.x = park.x + (o.x - old.x) / old.w * park.w; o.y = park.y + (o.y - old.y) / old.h * park.h; };
    dogs.forEach(mv); balls.forEach(mv); treats.forEach(mv);
  }
  drawBackground();
}

/* ================= background (cached) ================= */
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pathCurve(g) {
  const p0 = { x: 0, y: F.gate.y }, p3 = rp(0.86, 0.86);
  g.beginPath(); g.moveTo(p0.x, p0.y);
  g.bezierCurveTo(park.x + park.w * 0.3, F.gate.y + park.h * 0.08, park.x + park.w * 0.5, park.y + park.h * 1.02, p3.x, p3.y);
}
function drawBackground() {
  const g = bctx, r = mulberry(7);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#6f9e4f'; g.fillRect(0, 0, W, H);
  // outer tufts
  for (let i = 0; i < 500; i++) { g.fillStyle = r() < 0.5 ? 'rgba(40,80,25,0.18)' : 'rgba(200,240,160,0.12)'; g.fillRect(r() * W, r() * H, 2, 5); }
  // lawn with mowing stripes
  g.save();
  g.beginPath(); g.rect(park.x, park.y, park.w, park.h); g.clip();
  const lg = g.createLinearGradient(0, park.y, 0, park.y + park.h);
  lg.addColorStop(0, '#93c56b'); lg.addColorStop(1, '#86bb5f');
  g.fillStyle = lg; g.fillRect(park.x, park.y, park.w, park.h);
  const band = 64 * K;
  g.fillStyle = 'rgba(255,255,255,0.055)';
  for (let x = park.x - park.h; x < park.x + park.w; x += band * 2) {
    g.beginPath(); g.moveTo(x, park.y); g.lineTo(x + band, park.y); g.lineTo(x + band + park.h * 0.5, park.y + park.h); g.lineTo(x + park.h * 0.5, park.y + park.h); g.fill();
  }
  // tree shade
  g.fillStyle = 'rgba(30,70,20,0.22)';
  g.beginPath(); g.ellipse(F.tree.x + 12 * K, F.tree.y + 4 * K, 96 * K, 30 * K, 0, 0, TAU); g.fill();
  // grass detail
  for (let i = 0; i < park.w * park.h / 900; i++) {
    const x = park.x + r() * park.w, y = park.y + r() * park.h;
    g.strokeStyle = r() < 0.6 ? 'rgba(60,110,35,0.35)' : 'rgba(210,245,170,0.35)';
    g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 3, y - 4 - r() * 3); g.stroke();
  }
  for (let i = 0; i < park.w * park.h / 9000; i++) { // daisies and clover
    const x = park.x + r() * park.w, y = park.y + r() * park.h;
    if (r() < 0.5) { g.fillStyle = '#fff'; for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; g.beginPath(); g.arc(x + Math.cos(a) * 2.2, y + Math.sin(a) * 1.6, 1.4, 0, TAU); g.fill(); } g.fillStyle = '#f2c94c'; g.beginPath(); g.arc(x, y, 1.2, 0, TAU); g.fill(); }
    else { g.fillStyle = 'rgba(70,130,45,0.6)'; for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(x + Math.cos(k * 2.1) * 2.4, y + Math.sin(k * 2.1) * 2, 2, 0, TAU); g.fill(); } }
  }
  // sandy path
  g.lineCap = 'round';

/* ================= dog drawing ================= */
function drawDog(g, P, x, y, s, shadow) {

      const a = Math.sin(P.phase + off) * 0.6 * P.move;
      const lift = Math.max(0, Math.cos(P.phase + off)) * 3 * P.move;
      const x0 = hx + (far ? 3 : 0), fx = x0 + Math.sin(a) * L * 1.1, fy = -lift;

      g.fillStyle = far ? shade(b.paw, -0.18) : b.paw;
      g.beginPath(); g.ellipse(fx + 1.5, fy - 1.6, b.legW * 0.65, b.legW * 0.42, 0, 0, TAU); g.fill();

    g.fillStyle = b.paw;
    g.beginPath(); g.ellipse(b.len * 0.48, -2.5, 6.5, 2.8, 0, 0, TAU); g.fill();
    g.fillStyle = shade(b.paw, -0.18);
    g.beginPath(); g.ellipse(b.len * 0.42, -4, 6, 2.6, 0, 0, TAU); g.fill();
  }

        g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-tl * 0.5, -tl * 0.35, -tl, -tl * 0.1); g.stroke();
        if (b.tailTip) { g.strokeStyle = b.tailTip; g.lineWidth = b.tailW; g.beginPath(); g.moveTo(-tl * 0.7, -tl * 0.22); g.quadraticCurveTo(-tl * 0.85, -tl * 0.18, -tl, -tl * 0.1); g.stroke(); }
      } else {
        g.strokeStyle = b.coat; g.lineWidth = b.tailW;
        g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-tl * 0.5, -tl * 0.4, -tl, -tl * 0.2); g.stroke();
      }
    } else if (b.tail === 'stub') {
      g.fillStyle = b.coat; g.beginPath(); g.ellipse(-3, -1, 5, 3.5, 0, 0, TAU); g.fill();
    } else if (b.tail === 'pom') {

  if (b.fluffy) {
    for (let k = 0; k < 16; k++) {
      const a = k / 16 * TAU;
      g.beginPath(); g.arc(Math.cos(a) * b.len * 0.45, by + Math.sin(a) * b.h * 0.42, b.h * 0.24, 0, TAU); g.fill();

  if (b.blaze) { g.save(); g.beginPath(); g.arc(hx, hy, r, 0, TAU); g.clip(); g.fillStyle = b.blaze; g.beginPath(); g.ellipse(hx + r * 0.62, hy - r * 0.1, r * 0.18, r * 0.95, -0.35, 0, TAU); g.fill(); g.restore(); }

  // muzzle and nose
  const mx = hx + r * 0.72 + b.snout * 0.35, my = hy + r * 0.3;
  g.fillStyle = b.muzzle;
  g.beginPath(); g.ellipse(mx, my, r * 0.4 + b.snout * 0.45, r * 0.38, 0, 0, TAU); g.fill();
  const nx = mx + r * 0.32 + b.snout * 0.42, ny = my - r * 0.14;
  g.fillStyle = '#1f1a18'; g.beginPath(); g.ellipse(nx, ny, r * 0.17, r * 0.14, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.5)'; g.beginPath(); g.arc(nx - r * 0.05, ny - r * 0.05, r * 0.05, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(30,20,15,0.6)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(nx - r * 0.05, ny + r * 0.12); g.quadraticCurveTo(nx - r * 0.2, my + r * 0.3, mx - r * 0.2, my + r * 0.22); g.stroke();
  if (P.tongue > 0.05 && !P.ball) {
    g.fillStyle = '#ef7a8f';
    roundRect(g, mx - r * 0.05, my + r * 0.18, r * 0.36, r * 0.25 + r * 0.45 * P.tongue, r * 0.17); g.fill();

  g.fillStyle = 'rgba(120,150,20,0.35)'; g.beginPath(); g.arc(bl.x + r * 0.25, y + r * 0.25, r * 0.7, 0, TAU); g.fill();

function tossTreat(x, y, forDog) {

  const near = dogs.filter(d => !d.busy && Math.hypot(d.x - tr.x, d.y - tr.y) < (d.state === 'rest' ? 170 : 420) * K)
    .sort((a, b) => Math.hypot(a.x - tr.x, a.y - tr.y) - Math.hypot(b.x - tr.x, b.y - tr.y)).slice(0, 4);

}

/* ================= particles ================= */
function emit(type, x, y) {
  const p = { type, x, y, vx: 0, vy: 0, life: 1, max: 1 };
  if (type === 'heart') { p.vx = rand(-18, 18); p.vy = rand(-50, -35); p.max = p.life = 1.3; p.s = rand(0.8, 1.2); }
  else if (type === 'z') { p.vx = rand(6, 14); p.vy = -18; p.max = p.life = 2; }
  else if (type === 'dust') { p.vx = rand(-15, 15); p.vy = rand(-10, -2); p.max = p.life = 0.6; p.s = rand(3, 6); }
  else if (type === 'drop') { p.vx = rand(-25, 25); p.vy = rand(-60, -30); p.max = p.life = 0.5; }
  else if (type === 'sniff') { p.vx = rand(-10, 10); p.vy = rand(-20, -10); p.max = p.life = 0.7; }
  else if (type === 'ring') { p.max = p.life = 0.9; }
  else if (type === 'spark') { for (let k = 0; k < 6; k++) { const a = k / 6 * TAU; parts.push({ type: 'star', x, y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, life: 0.5, max: 0.5 }); } return; }
  parts.push(p);
}
function updateParts(dt) {
  for (const p of parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'drop') p.vy += 260 * dt;
    if (p.type === 'z') p.vx *= 0.98;
  }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 600) parts.splice(0, parts.length - 600);
}
function heartPath(g, x, y, s) {
  g.beginPath(); g.moveTo(x, y + s * 0.35);
  g.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.45, y - s * 1.1, x, y - s * 0.45);
  g.bezierCurveTo(x + s * 0.45, y - s * 1.1, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
}
function drawParts(g) {
  for (const p of parts) {
    const a = Math.max(0, p.life / p.max);
    g.globalAlpha = a;
    if (p.type === 'heart') { g.fillStyle = '#ec4f78'; heartPath(g, p.x, p.y, 7 * K * p.s); g.fill(); }
    else if (p.type === 'z') { g.fillStyle = '#ffffff'; g.font = `600 ${(11 + (1 - a) * 6) * K}px Fredoka, sans-serif`; g.fillText('z', p.x, p.y); }
    else if (p.type === 'dust') { g.fillStyle = 'rgba(220,200,150,0.7)'; g.beginPath(); g.arc(p.x, p.y, p.s * K * (1.6 - a), 0, TAU); g.fill(); }
    else if (p.type === 'drop') { g.fillStyle = '#7cc3f5'; g.beginPath(); g.arc(p.x, p.y, 1.8 * K, 0, TAU); g.fill(); }
    else if (p.type === 'sniff') { g.fillStyle = 'rgba(255,255,255,0.8)'; g.beginPath(); g.arc(p.x, p.y, 1.5 * K, 0, TAU); g.fill(); }
    else if (p.type === 'star') { g.fillStyle = '#fff6b0'; g.beginPath(); g.arc(p.x, p.y, 2 * K, 0, TAU); g.fill(); }
    else if (p.type === 'ring') { g.strokeStyle = '#ffffff'; g.lineWidth = 2.5; for (let k = 0; k < 2; k++) { g.beginPath(); g.arc(p.x, p.y, (1 - a) * 160 * K + k * 26 * K, 0, TAU); g.stroke(); } }
  }
  g.globalAlpha = 1;
}

/* ================= time of day ================= */
const TOD = {
  morning: { tint: '#fff1df' }, noon: { tint: null },
  golden: { tint: '#ffd6a0' }, night: { tint: '#46548f' },
};
const flies = Array.from({ length: 26 }, () => ({ u: Math.random(), v: Math.random(), ph: rand(0, TAU), sp: rand(0.3, 0.8) }));
function drawLighting(g) {
  const t = TOD[S.tod];
  if (!t.tint) return;
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = t.tint; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';
  if (S.tod === 'golden') {
    const gr = g.createLinearGradient(W, 0, 0, H);
    gr.addColorStop(0, 'rgba(255,170,80,0.18)'); gr.addColorStop(1, 'rgba(255,170,80,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  if (S.tod === 'golden' || S.tod === 'night') {
    const { x, y } = F.lamp, k = K, strong = S.tod === 'night' ? 1 : 0.35;
    let gr = g.createRadialGradient(x, y - 96 * k, 0, x, y - 96 * k, 60 * k);
    gr.addColorStop(0, `rgba(255,220,140,${0.55 * strong})`); gr.addColorStop(1, 'rgba(255,220,140,0)');
    g.fillStyle = gr; g.fillRect(x - 60 * k, y - 160 * k, 120 * k, 120 * k);
    g.save(); g.translate(x, y); g.scale(1, 0.42);
    gr = g.createRadialGradient(0, 0, 0, 0, 0, 170 * k);
    gr.addColorStop(0, `rgba(255,205,120,${0.42 * strong})`); gr.addColorStop(1, 'rgba(255,205,120,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 170 * k, 0, TAU); g.fill(); g.restore();
  }
  if (S.tod === 'night') {
    for (const f of flies) {
      const x = park.x + (f.u + Math.sin(time * 0.2 * f.sp + f.ph) * 0.04) * park.w;
      const y = park.y + (f.v + Math.cos(time * 0.27 * f.sp + f.ph) * 0.05) * park.h;
      const a = 0.5 + 0.5 * Math.sin(time * 2.4 * f.sp + f.ph);
      const gr = g.createRadialGradient(x, y, 0, x, y, 9 * K);
      gr.addColorStop(0, `rgba(230,255,140,${0.9 * a})`); gr.addColorStop(1, 'rgba(230,255,140,0)');
      g.fillStyle = gr; g.fillRect(x - 9 * K, y - 9 * K, 18 * K, 18 * K);
    }
  }
  g.globalCompositeOperation = 'source-over';
}

function drawBubble(g, d) {

function drawTag(g, d) {

function drawAim(g) {
  if (!aim) return;
  const dx = pointer.x - aim.x, dy = pointer.y - aim.y, len = Math.hypot(dx, dy);
  g.fillStyle = '#d6ec3f'; g.beginPath(); g.arc(aim.x, aim.y - 10 * K, 6 * K, 0, TAU); g.fill();
  if (len < 12) return;
  const v = throwVel(dx, dy), vz = 160 + Math.hypot(v.x, v.y) * 0.32, tAir = 2 * vz / GRAV;
  const land = inPark(aim.x + v.x * tAir, aim.y + v.y * tAir);
  g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 2.5; g.setLineDash([2, 7]); g.lineCap = 'round';

  for (let k = 0; k <= 24; k++) {
    const t = k / 24 * tAir, px = aim.x + v.x * t, py = aim.y + v.y * t - (vz * t - GRAV * t * t / 2) - 10 * K;
    k ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.stroke(); g.setLineDash([]);
  g.strokeStyle = '#ffffff'; g.lineWidth = 2;
  g.beginPath(); g.ellipse(land.x, land.y, 12 * K, 5 * K, 0, 0, TAU); g.stroke();
}

/* ================= sound (optional, synthesized) ================= */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
function barkSound(size) {
  if (!S.sound || !ac()) return;
  const a = AC, t = a.currentTime, f0 = 440 / size;
  for (let k = 0; k < (Math.random() < 0.4 ? 2 : 1); k++) {
    const t0 = t + k * 0.17;
    const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(f0 * 1.2, t0); o.frequency.exponentialRampToValueAtTime(f0 * 0.55, t0 + 0.13);
    f.type = 'bandpass'; f.frequency.value = f0 * 2.4; f.Q.value = 1.4;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
    o.connect(f).connect(g).connect(a.destination); o.start(t0); o.stop(t0 + 0.18);
  }
}
function squeak() {
  if (!S.sound || !ac()) return;
  const a = AC, t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(1300, t); o.frequency.exponentialRampToValueAtTime(2100, t + 0.08); o.frequency.exponentialRampToValueAtTime(1500, t + 0.16);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.2);
}
function whistleSound() {
  if (!S.sound || !ac()) return;
  const a = AC, t = a.currentTime;
  [[0, 2200, 2600], [0.22, 2600, 2000]].forEach(([d, f1, f2]) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f1, t + d); o.frequency.linearRampToValueAtTime(f2, t + d + 0.18);
    g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.1, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.2);
    o.connect(g).connect(a.destination); o.start(t + d); o.stop(t + d + 0.22);
  });
}

/* ================= input ================= */
const pointer = { x: 0, y: 0, down: false };
let aim = null, petting = null;
const throwVel = (dx, dy) => { let vx = dx * 3.1, vy = dy * 3.1; const m = Math.hypot(vx, vy), mx = 1050 * K; if (m > mx) { vx *= mx / m; vy *= mx / m; } return { x: vx, y: vy }; };
function dogAt(x, y) { let best = null; for (const d of dogs) if (d.hit(x, y) && (!best || d.y > best.y)) best = d; return best; }
cv.addEventListener('pointerdown', e => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.down = true;
  cv.setPointerCapture(e.pointerId);
  if (S.sound) ac()?.resume?.();
  const d = dogAt(e.clientX, e.clientY);
  if (d && d.state !== 'leave' && d.state !== 'enter') {
    petting = d; selectDog(d, true);
    if (d.carry) d.dropBall();
    d.pending = null; d.set('petted');
    return;
  }
  if (S.tool === 'ball') aim = { x: e.clientX, y: e.clientY };
  else if (S.tool === 'treat') tossTreat(e.clientX, e.clientY);
  else whistle(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', e => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (!pointer.down) { hovered = dogAt(e.clientX, e.clientY); cv.style.cursor = hovered ? 'grab' : 'crosshair'; }
});
function endPointer(e) {
  pointer.down = false;
  if (petting) { if (petting.state === 'petted') petting.set('sit', 1.4); petting = null; }
  if (aim && e.type === 'pointerup') {
    const dx = pointer.x - aim.x, dy = pointer.y - aim.y;
    let v;
    if (Math.hypot(dx, dy) < 12) { const a = rand(0, TAU); v = { x: Math.cos(a) * 170 * K, y: Math.sin(a) * 120 * K }; }
    else v = throwVel(dx, dy);
    const o = inPark(aim.x, aim.y);
    throwBall(o.x, o.y, v.x, v.y);
  }
  aim = null;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', () => { if (!pointer.down) hovered = null; });

const HINTS = {

const list = document.getElementById('dogs'), countEl = document.getElementById('count');
const roster = document.getElementById('roster'), drawerBtn = document.getElementById('drawer');

drawerBtn.addEventListener('click', () => {

function portrait(canvas, d) {
  const w = 64, h = 46, dpr = DPR;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const b = d.b, totalW = b.len + b.headR * 2.4 + b.snout + (b.tailLen || 10) * 0.6, totalH = b.leg + b.h + b.headR * 2.4;
  const s = Math.min(54 / totalW, 38 / totalH);
  const P = { b, face: 1, phase: 0, move: 0, wag: 0.4, headDown: 0, lie: 0, sit: 0, tongue: 0.6, happy: false, sleep: false, blink: false, ball: false, spots: d.spots };
  drawDog(g, P, w / 2 - (b.headR + b.snout * 0.5 - (b.tailLen || 10) * 0.3) * s * 0.6, h - 5, s, true);
}
function buildRoster() {
  list.innerHTML = '';
  countEl.textContent = dogs.length;
  for (const d of dogs) {
    const li = document.createElement('li');
    li.className = 'dog' + (d === selected ? ' sel' : ''); li.dataset.id = d.id;
    li.innerHTML = `
      <button type="button" class="dog-main" aria-pressed="${d === selected}">

        <span class="who"><strong></strong><span class="breed"></span><span class="doing"></span></span>
      </button>
      <div class="meters">

        <div class="meter">Happiness<i style="--c: var(--happy)"></i></div>
      </div>
      <div class="acts"><button type="button" data-act="treat">Give a treat</button><button type="button" data-act="home">Send home</button></div>`;
    li.querySelector('strong').textContent = d.name;
    li.querySelector('.breed').textContent = d.b.name;
    portrait(li.querySelector('canvas'), d);
    li.querySelector('.dog-main').addEventListener('click', () => selectDog(selected === d ? null : d));
    li.querySelector('[data-act="treat"]').addEventListener('click', () => {
      if (d.busy) return;
      tossTreat(d.x + d.face * (d.b.len * 0.5 + 30) * d.s, d.y + 4 * K, d);
    });
    li.querySelector('[data-act="home"]').addEventListener('click', () => { d.pending = null; d.set('leave'); d.say('Bye!', 1.2); });
    d.li = li;
    list.appendChild(li);
  }
  refreshRoster();
  updateAdopt();
}
function refreshRoster() {

function selectDog(d, scroll) {

/* ================= adopt ================= */
const breedSel = document.getElementById('breed'), nameIn = document.getElementById('dogname'), note = document.getElementById('note'), goBtn = document.getElementById('go');
breedSel.innerHTML = '<option value="any">Surprise me</option>' + Object.entries(BREEDS).map(([k, b]) => `<option value="${k}">${b.name}</option>`).join('');
function freeName() { const used = new Set(dogs.map(d => d.name)); const left = NAMES.filter(n => !used.has(n)); return left.length ? pick(left) : 'Buddy ' + (uid + 1); }
function updateAdopt() {
  const full = dogs.length >= MAX_DOGS;

  note.textContent = full ? `The park is full at ${MAX_DOGS} dogs. Send someone home to make room.` : '';
}

  note.textContent = `${name} the ${BREEDS[breed].name} is coming through the gate.`;
  buildRoster();
  setTimeout(() => { if (note.textContent.startsWith(name)) note.textContent = ''; }, 3500);
});

/* ================= loop ================= */
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  for (const d of dogs) d.update(dt);
  if (dogs.some(d => d.gone)) {
    for (const d of dogs) if (d.gone) { if (d === selected) selected = null; for (const o of dogs) if (o.partner === d) o.partner = null; }
    dogs = dogs.filter(d => !d.gone); buildRoster();
  }
  updateBalls(dt); updateTreats(dt); updateParts(dt);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const items = [
    { y: F.tree.y, draw: drawTree }, { y: F.bench.y, draw: drawBench }, { y: F.hydrant.y, draw: drawHydrant },
    { y: F.bowl.y, draw: drawBowl }, { y: F.lamp.y, draw: drawLamp },
  ];
  for (const t of treats) items.push({ y: t.y - 0.5, draw: g => drawTreat(g, t) });
  for (const bl of balls) items.push({ y: bl.y, draw: g => drawBall(g, bl) });
  for (const d of dogs) items.push({ y: d.y, draw: g => d.draw(g) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.draw(ctx);
  drawBottomFence(ctx);
  drawParts(ctx);
  drawLighting(ctx);
  for (const d of dogs) if (S.names || d === selected || d === hovered) drawTag(ctx, d);
  for (const d of dogs) if (d.bubble) drawBubble(ctx, d);
  drawAim(ctx);

  rosterTimer += dt;
  if (rosterTimer > 0.3) { rosterTimer = 0; refreshRoster(); }
  requestAnimationFrame(frame);
}
let last = performance.now(), rosterTimer = 0;

/* ================= boot ================= */
if (window.innerWidth <= 900) { roster.classList.add('closed'); drawerBtn.textContent = 'Show'; drawerBtn.setAttribute('aria-expanded', 'false'); }
layout();
const start = [['golden', 'Biscuit'], ['corgi', 'Mochi'], ['dalmatian', 'Pepper'], ['husky', 'Juniper'], ['pug', 'Waffles'], ['dachshund', 'Noodle']];
for (const [br, nm] of start) {
  const B = bounds();
  const d = new Dog(br, nm, rand(B.x0 + 60 * K, B.x1 - 40 * K), rand(B.y0 + 20 * K, B.y1 - 20 * K), false);
  dogs.push(d);
}
dogs[4].energy = 20; // Waffles starts the day with a nap
balls.push({ x: park.x + park.w * 0.5, y: park.y + park.h * 0.55, z: 0, vx: 0, vy: 0, vz: 0, carrier: null, origin: { x: park.x + park.w * 0.5, y: park.y + park.h * 0.55 } });
buildRoster();
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layout); });
drawerBtn.addEventListener('click', () => requestAnimationFrame(layout));
document.fonts?.ready?.then(() => layout());
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
