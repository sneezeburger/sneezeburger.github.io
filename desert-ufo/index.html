<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Desert Abduction - Particle Mesa</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
  Desert Abduction Scene:
  - Mesa landscape with particle sand
  - UFOs with tractor beams abducting livestock
  - Spectral fish swimming through the air (desert mirage)
  - Horses galloping across the desert floor
  - Alien figures wandering
  - Particle dust storms and stars
*/

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Time
let t = 0;

// Stars
const stars = Array.from({length: 200}, () => ({
  x: Math.random(), y: Math.random() * 0.5,
  s: Math.random() * 2 + 0.5, b: Math.random()
}));

// Sand particles
const sand = Array.from({length: 300}, () => ({
  x: Math.random() * 2 - 0.5,
  y: 0.7 + Math.random() * 0.3,
  vx: Math.random() * 0.001 + 0.0005,
  s: Math.random() * 3 + 1,
  a: Math.random() * 0.5 + 0.2
}));

// UFOs
const ufos = Array.from({length: 3}, (_, i) => ({
  x: 0.2 + i * 0.3,
  y: 0.15 + i * 0.05,
  phase: i * 2.1,
  beamOn: i === 1,
  size: 40 + i * 10
}));

// Horses
const horses = Array.from({length: 5}, (_, i) => ({
  x: Math.random() * 1.5 - 0.25,
  y: 0.72 + Math.random() * 0.05,
  speed: 0.0003 + Math.random() * 0.0004,
  size: 20 + Math.random() * 15,
  phase: Math.random() * Math.PI * 2,
  color: `hsl(${25 + Math.random() * 20}, ${50 + Math.random() * 30}%, ${30 + Math.random() * 25}%)`
}));

// Fish (mirage fish floating in the air)
const fish = Array.from({length: 8}, (_, i) => ({
  x: Math.random(),
  y: 0.3 + Math.random() * 0.35,
  vx: (Math.random() - 0.5) * 0.001,
  phase: Math.random() * Math.PI * 2,
  size: 12 + Math.random() * 18,
  hue: 180 + Math.random() * 60
}));

// Aliens
const aliens = Array.from({length: 4}, (_, i) => ({
  x: 0.1 + Math.random() * 0.8,
  y: 0.73 + Math.random() * 0.04,
  phase: Math.random() * Math.PI * 2,
  size: 15 + Math.random() * 10
}));

// Livestock (cows being abducted)
const livestock = Array.from({length: 3}, (_, i) => ({
  x: 0.35 + i * 0.15,
  baseY: 0.74,
  abductY: 0,
  abducting: false,
  phase: Math.random() * Math.PI * 2,
  size: 18
}));

// Beam particles
const beamParticles = [];

function drawGradientSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  const nightCycle = Math.sin(t * 0.0001) * 0.3 + 0.5;
  grad.addColorStop(0, `hsl(260, 40%, ${5 + nightCycle * 5}%)`);
  grad.addColorStop(0.3, `hsl(280, 30%, ${10 + nightCycle * 8}%)`);
  grad.addColorStop(0.5, `hsl(20, 50%, ${8 + nightCycle * 12}%)`);
  grad.addColorStop(0.7, `hsl(30, 60%, ${15 + nightCycle * 10}%)`);
  grad.addColorStop(1, `hsl(35, 70%, ${20 + nightCycle * 5}%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawStars() {
  stars.forEach(s => {
    const flicker = Math.sin(t * 0.003 + s.b * 10) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,255,220,${flicker * 0.8})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.s, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawMesas() {
  // Back mesa
  ctx.fillStyle = '#2a1a0a';
  ctx.beginPath();
  ctx.moveTo(W * 0.05, H * 0.7);
  ctx.lineTo(W * 0.1, H * 0.5);
  ctx.lineTo(W * 0.25, H * 0.48);
  ctx.lineTo(W * 0.3, H * 0.7);
  ctx.fill();

  // Main mesa
  ctx.fillStyle = '#3d2010';
  ctx.beginPath();
  ctx.moveTo(W * 0.55, H * 0.7);
  ctx.lineTo(W * 0.6, H * 0.42);
  ctx.lineTo(W * 0.62, H * 0.4);
  ctx.lineTo(W * 0.82, H * 0.4);
  ctx.lineTo(W * 0.85, H * 0.42);
  ctx.lineTo(W * 0.9, H * 0.7);
  ctx.fill();

  // Mesa stripes
  for (let i = 0; i < 5; i++) {
    ctx.strokeStyle = `rgba(${180 + i * 15}, ${80 + i * 10}, ${30}, 0.3)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    const y = H * (0.44 + i * 0.055);
    ctx.moveTo(W * 0.61, y);
    ctx.lineTo(W * 0.84, y);
    ctx.stroke();
  }

  // Small distant mesa
  ctx.fillStyle = '#1f1008';
  ctx.beginPath();
  ctx.moveTo(W * 0.35, H * 0.7);
  ctx.lineTo(W * 0.38, H * 0.55);
  ctx.lineTo(W * 0.48, H * 0.54);
  ctx.lineTo(W * 0.5, H * 0.7);
  ctx.fill();
}

function drawDesertFloor() {
  const grad = ctx.createLinearGradient(0, H * 0.7, 0, H);
  grad.addColorStop(0, '#4a3020');
  grad.addColorStop(0.5, '#5c3a22');
  grad.addColorStop(1, '#3a2515');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H * 0.7, W, H * 0.3);
}

function drawSandParticles() {
  sand.forEach(p => {
    p.x += p.vx + Math.sin(t * 0.002 + p.y * 5) * 0.0003;
    if (p.x > 1.5) p.x = -0.5;
    const windY = Math.sin(t * 0.001 + p.x * 3) * 0.01;
    ctx.fillStyle = `rgba(210, 180, 140, ${p.a * (0.5 + Math.sin(t * 0.002 + p.x) * 0.3)})`;
    ctx.beginPath();
    ctx.arc(p.x * W, (p.y + windY) * H, p.s, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawUFO(ufo) {
  const x = (ufo.x + Math.sin(t * 0.001 + ufo.phase) * 0.08) * W;
  const y = (ufo.y + Math.cos(t * 0.0008 + ufo.phase) * 0.03) * H;
  const s = ufo.size;

  // Glow
  const glow = ctx.createRadialGradient(x, y, 0, x, y, s * 2);
  glow.addColorStop(0, 'rgba(100, 255, 150, 0.2)');
  glow.addColorStop(1, 'rgba(100, 255, 150, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, s * 2, 0, Math.PI * 2);
  ctx.fill();

  // Saucer body
  ctx.fillStyle = '#556';
  ctx.beginPath();
  ctx.ellipse(x, y, s, s * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Dome
  ctx.fillStyle = `rgba(150, 255, 200, ${0.5 + Math.sin(t * 0.005) * 0.2})`;
  ctx.beginPath();
  ctx.ellipse(x, y - s * 0.15, s * 0.5, s * 0.4, 0, Math.PI, 0);
  ctx.fill();

  // Lights around rim
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + t * 0.003;
    const lx = x + Math.cos(angle) * s * 0.85;
    const ly = y + Math.sin(angle) * s * 0.2;
    const hue = (i * 45 + t * 0.5) % 360;
    ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
    ctx.beginPath();
    ctx.arc(lx, ly, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Tractor beam
  if (ufo.beamOn || Math.sin(t * 0.001 + ufo.phase * 2) > 0.3) {
    ctx.save();
    ctx.globalAlpha = 0.15 + Math.sin(t * 0.004) * 0.08;
    const beamGrad = ctx.createLinearGradient(x, y, x, H * 0.75);
    beamGrad.addColorStop(0, 'rgba(100, 255, 150, 0.6)');
    beamGrad.addColorStop(1, 'rgba(100, 255, 150, 0)');
    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(x - s * 0.3, y + s * 0.2);
    ctx.lineTo(x - s * 1.5, H * 0.78);
    ctx.lineTo(x + s * 1.5, H * 0.78);
    ctx.lineTo(x + s * 0.3, y + s * 0.2);
    ctx.fill();
    ctx.restore();

    // Beam particles
    for (let i = 0; i < 2; i++) {
      beamParticles.push({
        x: x + (Math.random() - 0.5) * s * 2,
        y: H * 0.75 - Math.random() * (H * 0.75 - y),
        vy: -1 - Math.random() * 2,
        life: 60,
        size: Math.random() * 3 + 1
      });
    }
  }

  return { x, y, s };
}

function drawHorse(horse) {
  const x = horse.x * W;
  const y = horse.y * H;
  const s = horse.size;
  const gallop = Math.sin(t * 0.008 + horse.phase) * 3;
  const legPhase = t * 0.01 + horse.phase;

  ctx.fillStyle = horse.color;

  // Body
  ctx.beginPath();
  ctx.ellipse(x, y + gallop, s * 1.5, s * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.ellipse(x + s * 1.3, y - s * 0.3 + gallop, s * 0.5, s * 0.4, -0.4, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  for (let i = 0; i < 4; i++) {
    const lx = x + (i - 1.5) * s * 0.6;
    const legSwing = Math.sin(legPhase + i * 1.2) * s * 0.4;
    ctx.strokeStyle = horse.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(lx, y + s * 0.4 + gallop);
    ctx.lineTo(lx + legSwing * 0.5, y + s * 1.2 + Math.abs(legSwing) * 0.3);
    ctx.stroke();
  }

  // Mane
  ctx.strokeStyle = `hsl(30, 20%, 15%)`;
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    const mx = x + s * (0.5 + i * 0.2);
    ctx.moveTo(mx, y - s * 0.5 + gallop);
    ctx.quadraticCurveTo(mx - 5, y - s * 0.8 + Math.sin(t * 0.005 + i) * 5 + gallop, mx - 10, y - s * 0.3 + gallop);
    ctx.stroke();
  }

  // Update
  horse.x += horse.speed;
  if (horse.x > 1.3) horse.x = -0.3;
}

function drawFish(f) {
  const x = (f.x + Math.sin(t * 0.001 + f.phase) * 0.1) * W;
  const y = (f.y + Math.cos(t * 0.0015 + f.phase) * 0.05) * H;
  const s = f.size;
  const swimAngle = Math.sin(t * 0.004 + f.phase) * 0.2;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(swimAngle);
  ctx.globalAlpha = 0.6 + Math.sin(t * 0.002 + f.phase) * 0.2;

  // Body - ghostly/translucent mirage fish
  const fishGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
  fishGrad.addColorStop(0, `hsla(${f.hue}, 80%, 60%, 0.8)`);
  fishGrad.addColorStop(1, `hsla(${f.hue}, 80%, 60%, 0)`);
  ctx.fillStyle = fishGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, s, s * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Solid body
  ctx.fillStyle = `hsla(${f.hue}, 70%, 50%, 0.7)`;
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.8, s * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tail
  ctx.beginPath();
  const tailWag = Math.sin(t * 0.008 + f.phase) * s * 0.3;
  ctx.moveTo(-s * 0.7, 0);
  ctx.lineTo(-s * 1.3, -s * 0.4 + tailWag);
  ctx.lineTo(-s * 1.3, s * 0.4 + tailWag);
  ctx.closePath();
  ctx.fillStyle = `hsla(${f.hue}, 60%, 45%, 0.6)`;
  ctx.fill();

  // Eye
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath();
  ctx.arc(s * 0.4, -s * 0.05, s * 0.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // Sparkle trail
  if (Math.random() > 0.7) {
    ctx.fillStyle = `hsla(${f.hue}, 90%, 80%, ${Math.random() * 0.5})`;
    ctx.beginPath();
    ctx.arc(x - Math.random() * s * 2, y + (Math.random() - 0.5) * s, Math.random() * 2 + 1, 0, Math.PI * 2);
    ctx.fill();
  }

  f.x += f.vx;
  if (f.x > 1.2) f.x = -0.2;
  if (f.x < -0.2) f.x = 1.2;
}

function drawAlien(alien) {
  const x = (alien.x + Math.sin(t * 0.002 + alien.phase) * 0.02) * W;
  const y = alien.y * H;
  const s = alien.size;
  const bob = Math.sin(t * 0.004 + alien.phase) * 3;

  // Body
  ctx.fillStyle = `rgba(100, 200, 120, 0.8)`;
  ctx.beginPath();
  ctx.ellipse(x, y + bob, s * 0.4, s * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head - big
  ctx.fillStyle = `rgba(120, 220, 140, 0.9)`;
  ctx.beginPath();
  ctx.ellipse(x, y - s * 0.9 + bob, s * 0.6, s * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes - large black almond shaped
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x - s * 0.2, y - s * 0.95 + bob, s * 0.18, s * 0.12, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + s * 0.2, y - s * 0.95 + bob, s * 0.18, s * 0.12, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Eye shine
  ctx.fillStyle = 'rgba(150, 255, 200, 0.4)';
  ctx.beginPath();
  ctx.arc(x - s * 0.15, y - s + bob, s * 0.06, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + s * 0.25, y - s + bob, s * 0.06, 0, Math.PI * 2);
  ctx.fill();

  // Arms
  ctx.strokeStyle = 'rgba(100, 200, 120, 0.7)';
  ctx.lineWidth = 2;
  const armWave = Math.sin(t * 0.005 + alien.phase) * 0.3;
  ctx.beginPath();
  ctx.moveTo(x - s * 0.3, y - s * 0.2 + bob);
  ctx.quadraticCurveTo(x - s, y - s * 0.5 + bob, x - s * 0.8, y - s * 0.8 + Math.sin(t * 0.006 + alien.phase) * s * 0.3 + bob);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + s * 0.3, y - s * 0.2 + bob);
  ctx.quadraticCurveTo(x + s, y - s * 0.5 + bob, x + s * 0.8, y - s * 0.8 + Math.cos(t * 0.006 + alien.phase) * s * 0.3 + bob);
  ctx.stroke();
}

function drawLivestock(ls) {
  // Check if near a beam
  const beamUfo = ufos[1];
  const ux = (beamUfo.x + Math.sin(t * 0.001 + beamUfo.phase) * 0.08);
  if (Math.abs(ls.x - ux) < 0.12) {
    ls.abducting = true;
    ls.abductY = Math.min(ls.abductY + 0.0005, 0.4);
  } else {
    ls.abducting = false;
    ls.abductY = Math.max(ls.abductY - 0.001, 0);
  }

  const x = ls.x * W;
  const y = (ls.baseY - ls.abductY) * H;
  const s = ls.size;
  const wobble = ls.abducting ? Math.sin(t * 0.01) * 5 : 0;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(wobble * 0.05);

  // Cow body
  ctx.fillStyle = '#eee';
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 1.2, s * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Spots
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(-s * 0.3, -s * 0.1, s * 0.3, s * 0.2, 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(s * 0.4, s * 0.1, s * 0.2, s * 0.15, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#eee';
  ctx.beginPath();
  ctx.ellipse(s * 1.1, -s * 0.2, s * 0.35, s * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs (dangling if abducting)
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 3;
  const legDangle = ls.abducting ? Math.sin(t * 0.006 + ls.phase) * 5 : 0;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo((i - 1.5) * s * 0.5, s * 0.5);
    ctx.lineTo((i - 1.5) * s * 0.5 + legDangle, s * 1.1 + (ls.abducting ? Math.sin(t * 0.008 + i) * 3 : 0));
    ctx.stroke();
  }

  ctx.restore();

  // Distress indicator if being abducted
  if (ls.abducting && Math.random() > 0.8) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '12px monospace';
    ctx.fillText('MOO!', x + s, y - s);
  }
}

function updateBeamParticles() {
  for (let i = beamParticles.length - 1; i >= 0; i--) {
    const p = beamParticles[i];
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) {
      beamParticles.splice(i, 1);
      continue;
    }
    ctx.fillStyle = `rgba(100, 255, 150, ${p.life / 60})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  // Limit particles
  if (beamParticles.length > 200) beamParticles.splice(0, 50);
}

function drawCacti() {
  const cactiPositions = [0.08, 0.32, 0.52, 0.78, 0.92];
  cactiPositions.forEach((cx, i) => {
    const x = cx * W;
    const y = H * 0.73;
    const h = 30 + i * 5;
    ctx.fillStyle = '#1a4a20';
    ctx.fillRect(x - 4, y - h, 8, h);
    // Arms
    ctx.fillRect(x - 4 - 10, y - h * 0.6, 10, 6);
    ctx.fillRect(x - 14, y - h * 0.6 - 12, 6, 12);
    ctx.fillRect(x + 4, y - h * 0.4, 12, 6);
    ctx.fillRect(x + 10, y - h * 0.4 - 15, 6, 15);
  });
}

function drawShootingStar() {
  if (Math.random() > 0.995) {
    const sx = Math.random() * W;
    const sy = Math.random() * H * 0.3;
    ctx.strokeStyle = 'rgba(255,255,200,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + 80, sy + 40);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,200,0.3)';
    ctx.beginPath();
    ctx.moveTo(sx + 80, sy + 40);
    ctx.lineTo(sx + 140, sy + 70);
    ctx.stroke();
  }
}

function animate() {
  t++;

  drawGradientSky();
  drawStars();
  drawShootingStar();
  drawMesas();
  drawDesertFloor();
  drawCacti();
  drawSandParticles();

  // Draw fish (mirage effect)
  fish.forEach(drawFish);

  // Draw UFOs
  ufos.forEach(drawUFO);

  // Draw beam particles
  updateBeamParticles();

  // Draw livestock being abducted
  livestock.forEach(drawLivestock);

  // Draw horses
  horses.forEach(drawHorse);

  // Draw aliens
  aliens.forEach(drawAlien);

  // Vignette
  const vignette = ctx.createRadialGradient(W/2, H/2, W * 0.3, W/2, H/2, W * 0.7);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
