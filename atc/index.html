<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web ATC — Air Traffic Control Radar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="radar"></canvas>
<script>
// Web ATC — Radar screen visualization with sweeping beam, aircraft, and flight data
const canvas = document.getElementById('radar');
const ctx = canvas.getContext('2d');

let W, H, CX, CY, R;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2;
  R = Math.min(CX, CY) * 0.92;
}
resize();
window.addEventListener('resize', resize);

// --- Configuration ---
const SWEEP_SPEED = 0.4;        // radians per second
const NUM_AIRCRAFT = 14;
const RING_COUNT = 5;
const TRAIL_LENGTH = 12;
const GREEN = '#00ff88';
const DIM_GREEN = '#00aa55';
const FAINT_GREEN = '#005533';
const BG = '#0a100e';

// --- Airline callsigns ---
const AIRLINES = ['UAL','DAL','AAL','SWA','JBU','SKW','BAW','DLH','AFR','KLM',
                   'ACA','QFA','SIA','CPA','THY','EIN','ICE','FIN','SAS','ANA'];
const FIXES = ['BRAVO','DELTA','FOXTROT','GOLF','HOTEL','KILO','LIMA','OSCAR',
               'PAPA','ROMEO','SIERRA','TANGO','VICTOR','ZULU','ALPHA','MIKE'];

function randCallsign() {
  return AIRLINES[Math.floor(Math.random() * AIRLINES.length)] +
         (100 + Math.floor(Math.random() * 900));
}

function randAltitude() {
  return (Math.floor(Math.random() * 35) + 5) * 10; // FL050-FL400 displayed as e.g. 350
}

function randSpeed() {
  return 180 + Math.floor(Math.random() * 300); // knots
}

// --- Aircraft ---
class Aircraft {
  constructor() {
    this.reset(true);
  }

  reset(initial) {
    // Spawn from edge or random position
    const angle = Math.random() * Math.PI * 2;
    const dist = initial ? Math.random() * 0.9 : (0.85 + Math.random() * 0.15);
    this.x = Math.cos(angle) * dist;
    this.y = Math.sin(angle) * dist;

    // Heading towards roughly center with some offset
    const targetAngle = Math.atan2(-this.y, -this.x) + (Math.random() - 0.5) * 1.2;
    this.speed = (0.02 + Math.random() * 0.04); // normalized units per second
    this.vx = Math.cos(targetAngle) * this.speed;
    this.vy = Math.sin(targetAngle) * this.speed;

    // Gentle turn rate
    this.turnRate = (Math.random() - 0.5) * 0.15;
    this.turnTimer = 3 + Math.random() * 10;

    this.callsign = randCallsign();
    this.altitude = randAltitude();
    this.groundSpeed = randSpeed();
    this.squawk = (1000 + Math.floor(Math.random() * 6777)).toString().padStart(4, '0');

    this.trail = [];
    this.blipIntensity = 0;
    this.lastSweptAngle = -999;
    this.dataTagSide = Math.random() > 0.5 ? 1 : -1;
  }

  update(dt) {
    // Apply gentle turning
    this.turnTimer -= dt;
    if (this.turnTimer <= 0) {
      this.turnRate = (Math.random() - 0.5) * 0.12;
      this.turnTimer = 4 + Math.random() * 12;
    }

    const heading = Math.atan2(this.vy, this.vx);
    const newHeading = heading + this.turnRate * dt;
    this.vx = Math.cos(newHeading) * this.speed;
    this.vy = Math.sin(newHeading) * this.speed;

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // Fade blip intensity
    this.blipIntensity = Math.max(0, this.blipIntensity - dt * 0.35);

    // Out of range? Reset
    const dist = Math.sqrt(this.x * this.x + this.y * this.y);
    if (dist > 1.15) {
      this.reset(false);
    }
  }

  // Called when the sweep beam passes over this aircraft
  sweep() {
    this.blipIntensity = 1.0;
    // Record trail position
    this.trail.push({ x: this.x, y: this.y, t: 1.0 });
    if (this.trail.length > TRAIL_LENGTH) this.trail.shift();
  }
}

const aircraft = [];
for (let i = 0; i < NUM_AIRCRAFT; i++) {
  aircraft.push(new Aircraft());
}

// --- Waypoints / Fixes ---
const fixes = [];
for (let i = 0; i < 8; i++) {
  const angle = (i / 8) * Math.PI * 2 + 0.3;
  const dist = 0.55 + Math.random() * 0.3;
  fixes.push({
    x: Math.cos(angle) * dist,
    y: Math.sin(angle) * dist,
    name: FIXES[i]
  });
}

// --- Sweep state ---
let sweepAngle = 0;
let lastTime = performance.now();

// --- Draw helpers ---
function toScreen(nx, ny) {
  return [CX + nx * R, CY + ny * R];
}

function drawRadarBackground() {
  // Dark background
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  // Range rings
  ctx.strokeStyle = FAINT_GREEN;
  ctx.lineWidth = 1;
  for (let i = 1; i <= RING_COUNT; i++) {
    const r = (i / RING_COUNT) * R;
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.stroke();

    // Range label
    ctx.fillStyle = FAINT_GREEN;
    ctx.font = '11px monospace';
    ctx.fillText((i * 20) + 'nm', CX + 4, CY - r + 14);
  }

  // Compass lines (every 30 degrees)
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + Math.cos(a) * R, CY + Math.sin(a) * R);
    ctx.strokeStyle = i % 3 === 0 ? FAINT_GREEN : '#003322';
    ctx.lineWidth = i % 3 === 0 ? 1 : 0.5;
    ctx.stroke();

    // Compass labels
    const labels = ['N','030','060','E','120','150','S','210','240','W','300','330'];
    const lx = CX + Math.cos(a) * (R + 18);
    const ly = CY + Math.sin(a) * (R + 18);
    ctx.fillStyle = DIM_GREEN;
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(labels[i], lx, ly);
  }

  // Outer circle
  ctx.strokeStyle = DIM_GREEN;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.stroke();

  // Center cross
  ctx.strokeStyle = DIM_GREEN;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(CX - 8, CY); ctx.lineTo(CX + 8, CY);
  ctx.moveTo(CX, CY - 8); ctx.lineTo(CX, CY + 8);
  ctx.stroke();
}

function drawFixes() {
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  fixes.forEach(f => {
    const [sx, sy] = toScreen(f.x, f.y);
    // Small triangle
    ctx.strokeStyle = FAINT_GREEN;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx, sy - 5);
    ctx.lineTo(sx - 4, sy + 3);
    ctx.lineTo(sx + 4, sy + 3);
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = FAINT_GREEN;
    ctx.fillText(f.name, sx, sy + 14);
  });
}

function drawSweep() {
  // Sweep beam with gradient fade trail
  const sweepLen = 0.6; // radians of visible trail
  const steps = 60;
  for (let i = 0; i < steps; i++) {
    const frac = i / steps;
    const a = sweepAngle - frac * sweepLen;
    const alpha = (1 - frac) * 0.15;
    ctx.strokeStyle = `rgba(0, 255, 136, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + Math.cos(a) * R, CY + Math.sin(a) * R);
    ctx.stroke();
  }

  // Bright leading edge
  ctx.strokeStyle = 'rgba(0, 255, 136, 0.5)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(CX + Math.cos(sweepAngle) * R, CY + Math.sin(sweepAngle) * R);
  ctx.stroke();
}

function drawAircraft() {
  aircraft.forEach(ac => {
    const dist = Math.sqrt(ac.x * ac.x + ac.y * ac.y);
    if (dist > 1.02) return;

    const [sx, sy] = toScreen(ac.x, ac.y);

    // Trail dots (previous positions)
    ac.trail.forEach((t, i) => {
      const age = ac.trail.length - i;
      const alpha = Math.max(0.05, (1 - age / TRAIL_LENGTH) * 0.5) * (t.t > 0 ? 1 : 0);
      const [tx, ty] = toScreen(t.x, t.y);
      ctx.fillStyle = `rgba(0, 255, 136, ${alpha})`;
      ctx.beginPath();
      ctx.arc(tx, ty, 1.5, 0, Math.PI * 2);
      ctx.fill();
      t.t = Math.max(0, t.t - 0.002);
    });

    // Main blip
    const intensity = Math.max(0.15, ac.blipIntensity);
    const blipSize = 3 + ac.blipIntensity * 2;

    // Glow
    if (ac.blipIntensity > 0.3) {
      const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, blipSize * 4);
      grad.addColorStop(0, `rgba(0, 255, 136, ${intensity * 0.3})`);
      grad.addColorStop(1, 'rgba(0, 255, 136, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(sx, sy, blipSize * 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Blip icon — small aircraft shape
    ctx.fillStyle = `rgba(0, 255, 136, ${intensity})`;
    ctx.beginPath();
    ctx.arc(sx, sy, blipSize, 0, Math.PI * 2);
    ctx.fill();

    // Heading line
    const heading = Math.atan2(ac.vy, ac.vx);
    ctx.strokeStyle = `rgba(0, 255, 136, ${intensity * 0.6})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(heading) * 18, sy + Math.sin(heading) * 18);
    ctx.stroke();

    // Data tag
    const tagOffX = ac.dataTagSide * 35;
    const tagOffY = -10;
    const tagX = sx + tagOffX;
    const tagY = sy + tagOffY;

    // Leader line
    ctx.strokeStyle = `rgba(0, 200, 100, ${intensity * 0.4})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(tagX, tagY);
    ctx.stroke();

    // Tag text
    ctx.textAlign = ac.dataTagSide > 0 ? 'left' : 'right';
    ctx.textBaseline = 'bottom';
    ctx.font = '10px monospace';

    const alphaText = Math.max(0.3, intensity * 0.9);
    ctx.fillStyle = `rgba(0, 255, 136, ${alphaText})`;
    ctx.fillText(ac.callsign, tagX, tagY);
    ctx.fillStyle = `rgba(0, 200, 100, ${alphaText * 0.8})`;
    ctx.fillText(`FL${ac.altitude} ${ac.groundSpeed}kt`, tagX, tagY + 12);
  });
}

function drawHUD() {
  // Top-left info block
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold 13px monospace';
  ctx.fillStyle = GREEN;
  ctx.fillText('TRACON RADAR', 14, 14);

  ctx.font = '11px monospace';
  ctx.fillStyle = DIM_GREEN;
  const now = new Date();
  const utc = now.toISOString().substr(11, 8);
  ctx.fillText(`UTC ${utc}`, 14, 32);
  ctx.fillText(`TGT: ${aircraft.length}`, 14, 46);
  ctx.fillText(`RNG: ${RING_COUNT * 20}nm`, 14, 60);

  // Top-right ATIS info
  ctx.textAlign = 'right';
  ctx.fillStyle = DIM_GREEN;
  ctx.font = '11px monospace';
  ctx.fillText('ATIS INFO KILO', W - 14, 14);
  ctx.fillText('ILS RWY 28L', W - 14, 28);
  ctx.fillText('WIND 270/12', W - 14, 42);
  ctx.fillText('VIS 10SM', W - 14, 56);
  ctx.fillText('ALT 29.92', W - 14, 70);

  // Bottom status bar
  ctx.fillStyle = '#001a10';
  ctx.fillRect(0, H - 28, W, 28);
  ctx.strokeStyle = FAINT_GREEN;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H - 28);
  ctx.lineTo(W, H - 28);
  ctx.stroke();

  ctx.textAlign = 'left';
  ctx.fillStyle = DIM_GREEN;
  ctx.font = '11px monospace';
  ctx.fillText('SYS NOMINAL  |  MODE: ARTS-III  |  CONFLICT: NONE  |  SEQ: AUTO', 14, H - 10);

  ctx.textAlign = 'right';
  ctx.fillText('WEB-ATC v1.0', W - 14, H - 10);
}

function drawScanlines() {
  // Subtle CRT scanline effect
  ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
  for (let y = 0; y < H; y += 3) {
    ctx.fillRect(0, y, W, 1);
  }
}

// --- Main loop ---
function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  // Update sweep
  sweepAngle += SWEEP_SPEED * dt;
  if (sweepAngle > Math.PI * 2) sweepAngle -= Math.PI * 2;

  // Update aircraft and check sweep
  aircraft.forEach(ac => {
    ac.update(dt);

    // Check if sweep beam just passed over this aircraft
    const acAngle = Math.atan2(ac.y, ac.x);
    // Normalize to [0, 2PI]
    const normAc = ((acAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const normSweep = ((sweepAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const diff = Math.abs(normSweep - normAc);
    if (diff < SWEEP_SPEED * dt * 1.5 || diff > Math.PI * 2 - SWEEP_SPEED * dt * 1.5) {
      if (now - (ac._lastSweepTime || 0) > 500) {
        ac.sweep();
        ac._lastSweepTime = now;
      }
    }
  });

  // Draw
  drawRadarBackground();
  drawFixes();
  drawSweep();
  drawAircraft();
  drawHUD();
  drawScanlines();

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
