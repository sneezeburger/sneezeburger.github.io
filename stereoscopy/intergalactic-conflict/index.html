<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stereoscopic 3D Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
        }
        #canvas { display: block; width: 100vw; height: 100vh; }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 140, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            z-index: 100;
            min-width: 260px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: transform 0.3s ease;
        }
        #controls.collapsed { transform: translateX(-220px); }
        #controls h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #7aa2ff;
            margin-bottom: 16px;
        }
        .control-group {
            margin-bottom: 14px;
        }
        .control-group label {
            display: block;
            font-size: 11px;
            color: #8899bb;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        select, input[type="range"] {
            width: 100%;
            background: rgba(20, 30, 60, 0.8);
            border: 1px solid rgba(100, 140, 255, 0.2);
            border-radius: 8px;
            color: #cde;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        select:hover, input[type="range"]:hover {
            border-color: rgba(100, 140, 255, 0.5);
        }
        input[type="range"] {
            -webkit-appearance: none;
            height: 6px;
            padding: 0;
            border-radius: 3px;
            background: linear-gradient(90deg, #1a2a5a, #4a6aff);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #7aa2ff;
            box-shadow: 0 0 10px rgba(122, 162, 255, 0.5);
            cursor: pointer;
        }
        #fps {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 12px;
            color: #5a7a9a;
            font-family: monospace;
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #4a6a8a;
            text-align: center;
            pointer-events: none;
        }
        .toggle-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #7aa2ff;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="controls">
        <button class="toggle-btn" onclick="this.parentElement.classList.toggle('collapsed')">&#9776;</button>
        <h2>&#x2B21; Stereo 3D</h2>
        <div class="control-group">
            <label>Stereo Mode</label>
            <select id="stereoMode">
                <option value="anaglyph">Anaglyph (Red/Cyan)</option>
                <option value="sidebyside" selected>Side by Side</option>
                <option value="mono">Mono (No Stereo)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Scene</label>
            <select id="scene">
                <option value="conflict">Intergalactic Conflict</option>
                <option value="particles">Particle Galaxy</option>
                <option value="geometry">Sacred Geometry</option>
                <option value="terrain">Fractal Terrain</option>
            </select>
        </div>
        <div class="control-group">
            <label>Eye Separation</label>
            <input type="range" id="eyeSep" min="0.01" max="0.2" step="0.005" value="0.064">
        </div>
        <div class="control-group">
            <label>Rotation Speed</label>
            <input type="range" id="speed" min="0" max="2" step="0.05" value="0.5">
        </div>
        <div class="control-group">
            <label>Depth Scale</label>
            <input type="range" id="depth" min="0.5" max="5" step="0.1" value="2">
        </div>
        <div class="control-group">
            <label>Bloom Intensity</label>
            <input type="range" id="bloom" min="0" max="2" step="0.05" value="0.8">
        </div>
    </div>
    <div id="fps">-- FPS</div>
    <div id="info">Drag to orbit &middot; Scroll to zoom &middot; Controls on the left</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { AnaglyphEffect } from 'three/addons/effects/AnaglyphEffect.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // Setup
        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // Post-processing
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.4, 0.85
        );
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        // Anaglyph effect
        let anaglyphEffect = new AnaglyphEffect(renderer);
        anaglyphEffect.setSize(window.innerWidth, window.innerHeight);

        // Scenes
        let currentSceneObjects = [];
        let particleSystem, geometryGroup, terrainMesh;
        let conflictData = null;

        function clearScene() {
            currentSceneObjects.forEach(obj => {
                scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
            });
            currentSceneObjects = [];
            particleSystem = null;
            geometryGroup = null;
            terrainMesh = null;
            conflictData = null;
        }

        // --- PARTICLE GALAXY ---
        function createParticleGalaxy() {
            const count = 80000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const radius = Math.random() * 12;
                const branch = (i % 5) * ((2 * Math.PI) / 5);
                const spin = radius * 0.8;
                const randomness = (Math.random() - 0.5) * 0.5 * radius * 0.3;

                positions[i3] = Math.cos(branch + spin) * radius + randomness;
                positions[i3 + 1] = (Math.random() - 0.5) * 1.5 * Math.exp(-radius * 0.15);
                positions[i3 + 2] = Math.sin(branch + spin) * radius + randomness;

                const mixRatio = radius / 12;
                colors[i3] = 0.8 - mixRatio * 0.6;
                colors[i3 + 1] = 0.3 + mixRatio * 0.2;
                colors[i3 + 2] = 0.8 + mixRatio * 0.2;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.04,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            currentSceneObjects.push(particleSystem);

            // Core glow
            const coreGeo = new THREE.SphereGeometry(0.3, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xaaccff, transparent: true, opacity: 0.6 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            scene.add(core);
            currentSceneObjects.push(core);
        }

        // --- SACRED GEOMETRY ---
        function createSacredGeometry() {
            geometryGroup = new THREE.Group();

            const materials = [
                new THREE.MeshPhysicalMaterial({ color: 0x4488ff, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.7 }),
                new THREE.MeshPhysicalMaterial({ color: 0xff4488, metalness: 0.8, roughness: 0.2, transparent: true, opacity: 0.6 }),
                new THREE.MeshPhysicalMaterial({ color: 0x44ff88, metalness: 0.7, roughness: 0.1, transparent: true, opacity: 0.5 }),
            ];

            // Nested polyhedra
            const geos = [
                new THREE.IcosahedronGeometry(3, 0),
                new THREE.OctahedronGeometry(2.2, 0),
                new THREE.TetrahedronGeometry(1.5, 0),
                new THREE.DodecahedronGeometry(1, 0),
            ];

            geos.forEach((geo, i) => {
                const mesh = new THREE.Mesh(geo, materials[i % materials.length].clone());
                mesh.material.wireframe = i % 2 === 0;
                geometryGroup.add(mesh);
            });

            // Orbiting smaller shapes
            for (let i = 0; i < 24; i++) {
                const angle = (i / 24) * Math.PI * 2;
                const radius = 4.5 + Math.sin(i * 1.5) * 0.8;
                const geo = i % 3 === 0 ? new THREE.OctahedronGeometry(0.2) :
                           i % 3 === 1 ? new THREE.TetrahedronGeometry(0.2) :
                           new THREE.IcosahedronGeometry(0.15);
                const mat = new THREE.MeshPhysicalMaterial({
                    color: new THREE.Color().setHSL(i / 24, 0.8, 0.6),
                    metalness: 0.9,
                    roughness: 0.1,
                    emissive: new THREE.Color().setHSL(i / 24, 0.8, 0.2),
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(Math.cos(angle) * radius, Math.sin(i * 0.5) * 1.5, Math.sin(angle) * radius);
                mesh.userData.orbitAngle = angle;
                mesh.userData.orbitRadius = radius;
                mesh.userData.orbitSpeed = 0.3 + Math.random() * 0.5;
                mesh.userData.yOffset = Math.sin(i * 0.5) * 1.5;
                geometryGroup.add(mesh);
            }

            scene.add(geometryGroup);
            currentSceneObjects.push(geometryGroup);

            // Lights for geometry scene
            const pointLight1 = new THREE.PointLight(0x4488ff, 50, 20);
            pointLight1.position.set(5, 5, 5);
            scene.add(pointLight1);
            currentSceneObjects.push(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff4488, 50, 20);
            pointLight2.position.set(-5, -3, -5);
            scene.add(pointLight2);
            currentSceneObjects.push(pointLight2);

            const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
            scene.add(ambientLight);
            currentSceneObjects.push(ambientLight);
        }

        // --- INTERGALACTIC CONFLICT ---
        function createConflict() {
            conflictData = { ships: [], lasers: [], explosions: [], fighters: [] };
            const group = new THREE.Group();

            // Capital ships (two opposing fleets)
            function createCapitalShip(color, emissiveColor) {
                const shipGroup = new THREE.Group();
                // Hull
                const hullGeo = new THREE.ConeGeometry(0.4, 3, 6);
                const hullMat = new THREE.MeshPhysicalMaterial({
                    color, metalness: 0.95, roughness: 0.2,
                    emissive: emissiveColor, emissiveIntensity: 0.3,
                });
                const hull = new THREE.Mesh(hullGeo, hullMat);
                hull.rotation.z = Math.PI / 2;
                shipGroup.add(hull);
                // Engine glow
                const engineGeo = new THREE.SphereGeometry(0.25, 8, 8);
                const engineMat = new THREE.MeshBasicMaterial({
                    color: emissiveColor, transparent: true, opacity: 0.8
                });
                const engine = new THREE.Mesh(engineGeo, engineMat);
                engine.position.x = -1.5;
                shipGroup.add(engine);
                // Bridge/command tower
                const bridgeGeo = new THREE.BoxGeometry(0.8, 0.3, 0.2);
                const bridge = new THREE.Mesh(bridgeGeo, hullMat);
                bridge.position.set(0.3, 0.3, 0);
                shipGroup.add(bridge);
                // Wing fins
                const finGeo = new THREE.BoxGeometry(1.2, 0.05, 0.8);
                const fin = new THREE.Mesh(finGeo, hullMat);
                fin.position.set(-0.3, 0, 0);
                shipGroup.add(fin);
                return shipGroup;
            }

            // Fleet A (blue/cyan)
            for (let i = 0; i < 5; i++) {
                const ship = createCapitalShip(0x334466, 0x00aaff);
                ship.position.set(-8 + i * 1.5, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 6);
                ship.rotation.y = 0.2;
                ship.userData.fleet = 'A';
                ship.userData.basePos = ship.position.clone();
                ship.userData.phase = Math.random() * Math.PI * 2;
                group.add(ship);
                conflictData.ships.push(ship);
            }

            // Fleet B (red/orange)
            for (let i = 0; i < 5; i++) {
                const ship = createCapitalShip(0x663322, 0xff4400);
                ship.position.set(8 - i * 1.5, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 6);
                ship.rotation.y = Math.PI - 0.2;
                ship.userData.fleet = 'B';
                ship.userData.basePos = ship.position.clone();
                ship.userData.phase = Math.random() * Math.PI * 2;
                group.add(ship);
                conflictData.ships.push(ship);
            }

            // Small fighters swarming around
            function createFighter(color) {
                const geo = new THREE.ConeGeometry(0.08, 0.4, 4);
                const mat = new THREE.MeshBasicMaterial({ color });
                const fighter = new THREE.Mesh(geo, mat);
                fighter.rotation.z = Math.PI / 2;
                return fighter;
            }

            for (let i = 0; i < 60; i++) {
                const isFleetA = i < 30;
                const fighter = createFighter(isFleetA ? 0x44ccff : 0xff6633);
                const angle = Math.random() * Math.PI * 2;
                const radius = 2 + Math.random() * 5;
                const cx = isFleetA ? -4 : 4;
                fighter.position.set(
                    cx + Math.cos(angle) * radius * 0.5,
                    (Math.random() - 0.5) * 6,
                    Math.sin(angle) * radius
                );
                fighter.userData.orbitCenter = new THREE.Vector3(cx, 0, 0);
                fighter.userData.orbitRadius = radius;
                fighter.userData.orbitAngle = angle;
                fighter.userData.orbitSpeed = 0.5 + Math.random() * 1.5;
                fighter.userData.ySpeed = 0.3 + Math.random();
                fighter.userData.fleet = isFleetA ? 'A' : 'B';
                group.add(fighter);
                conflictData.fighters.push(fighter);
            }

            // Laser beams (continuously generated)
            const laserPool = [];
            for (let i = 0; i < 40; i++) {
                const laserGeo = new THREE.CylinderGeometry(0.02, 0.02, 1, 4);
                laserGeo.rotateZ(Math.PI / 2);
                const isBlue = i < 20;
                const laserMat = new THREE.MeshBasicMaterial({
                    color: isBlue ? 0x00ccff : 0xff3300,
                    transparent: true, opacity: 0.9,
                });
                const laser = new THREE.Mesh(laserGeo, laserMat);
                laser.visible = false;
                laser.userData.velocity = new THREE.Vector3();
                laser.userData.life = 0;
                laser.userData.maxLife = 2;
                laser.userData.isBlue = isBlue;
                group.add(laser);
                laserPool.push(laser);
            }
            conflictData.lasers = laserPool;

            // Explosion particle systems
            for (let i = 0; i < 12; i++) {
                const expCount = 200;
                const expGeo = new THREE.BufferGeometry();
                const expPos = new Float32Array(expCount * 3);
                const expVel = new Float32Array(expCount * 3);
                for (let j = 0; j < expCount; j++) {
                    expPos[j * 3] = expPos[j * 3 + 1] = expPos[j * 3 + 2] = 0;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const speed = 1 + Math.random() * 4;
                    expVel[j * 3] = Math.sin(phi) * Math.cos(theta) * speed;
                    expVel[j * 3 + 1] = Math.sin(phi) * Math.sin(theta) * speed;
                    expVel[j * 3 + 2] = Math.cos(phi) * speed;
                }
                expGeo.setAttribute('position', new THREE.BufferAttribute(expPos, 3));
                const expMat = new THREE.PointsMaterial({
                    size: 0.08, color: i < 6 ? 0xffaa33 : 0xff4400,
                    blending: THREE.AdditiveBlending, transparent: true,
                    opacity: 0, depthWrite: false,
                });
                const explosion = new THREE.Points(expGeo, expMat);
                explosion.userData.velocities = expVel;
                explosion.userData.life = -1; // inactive
                explosion.userData.origin = new THREE.Vector3();
                group.add(explosion);
                conflictData.explosions.push(explosion);
            }

            // Debris field (destroyed ship fragments)
            for (let i = 0; i < 30; i++) {
                const size = 0.1 + Math.random() * 0.3;
                const geo = i % 3 === 0 ? new THREE.BoxGeometry(size, size * 0.5, size * 0.3) :
                           i % 3 === 1 ? new THREE.TetrahedronGeometry(size * 0.5) :
                           new THREE.OctahedronGeometry(size * 0.4);
                const mat = new THREE.MeshPhysicalMaterial({
                    color: 0x444444, metalness: 0.9, roughness: 0.4,
                    emissive: 0x331100, emissiveIntensity: Math.random() * 0.5,
                });
                const debris = new THREE.Mesh(geo, mat);
                debris.position.set(
                    (Math.random() - 0.5) * 12,
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 10
                );
                debris.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                debris.userData.rotSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2
                );
                group.add(debris);
            }

            // Nebula backdrop (colored gas clouds)
            const nebulaCount = 15000;
            const nebulaGeo = new THREE.BufferGeometry();
            const nebulaPos = new Float32Array(nebulaCount * 3);
            const nebulaColors = new Float32Array(nebulaCount * 3);
            for (let i = 0; i < nebulaCount; i++) {
                const r = 15 + Math.random() * 25;
                const theta = Math.random() * Math.PI * 2;
                const phi = (Math.random() - 0.5) * 1.2;
                nebulaPos[i * 3] = r * Math.cos(theta) * Math.cos(phi);
                nebulaPos[i * 3 + 1] = r * Math.sin(phi) * 0.4;
                nebulaPos[i * 3 + 2] = r * Math.sin(theta) * Math.cos(phi);
                // Red/purple/orange nebula
                const t = Math.random();
                nebulaColors[i * 3] = 0.4 + t * 0.5;
                nebulaColors[i * 3 + 1] = t * 0.15;
                nebulaColors[i * 3 + 2] = 0.2 + (1 - t) * 0.4;
            }
            nebulaGeo.setAttribute('position', new THREE.BufferAttribute(nebulaPos, 3));
            nebulaGeo.setAttribute('color', new THREE.BufferAttribute(nebulaColors, 3));
            const nebulaMat = new THREE.PointsMaterial({
                size: 0.3, vertexColors: true, transparent: true,
                opacity: 0.15, blending: THREE.AdditiveBlending, depthWrite: false,
            });
            const nebula = new THREE.Points(nebulaGeo, nebulaMat);
            group.add(nebula);

            // Lighting
            const battleLight1 = new THREE.PointLight(0x4488ff, 30, 30);
            battleLight1.position.set(-6, 3, 0);
            group.add(battleLight1);

            const battleLight2 = new THREE.PointLight(0xff4400, 30, 30);
            battleLight2.position.set(6, -2, 0);
            group.add(battleLight2);

            const ambientBattle = new THREE.AmbientLight(0x111122, 0.8);
            group.add(ambientBattle);

            scene.add(group);
            currentSceneObjects.push(group);
        }

        function animateConflict(time, depthScale) {
            if (!conflictData) return;

            // Animate capital ships (subtle drift)
            conflictData.ships.forEach(ship => {
                const bp = ship.userData.basePos;
                const p = ship.userData.phase;
                ship.position.x = bp.x + Math.sin(time * 0.3 + p) * 0.5;
                ship.position.y = bp.y + Math.sin(time * 0.5 + p * 2) * 0.3 * depthScale * 0.3;
                ship.position.z = bp.z + Math.cos(time * 0.4 + p) * 0.4;
            });

            // Animate fighters
            conflictData.fighters.forEach(f => {
                f.userData.orbitAngle += f.userData.orbitSpeed * 0.016;
                const a = f.userData.orbitAngle;
                const c = f.userData.orbitCenter;
                const r = f.userData.orbitRadius;
                f.position.x = c.x + Math.cos(a) * r * 0.5;
                f.position.z = c.z + Math.sin(a) * r;
                f.position.y += Math.sin(time * f.userData.ySpeed + a) * 0.02 * depthScale * 0.3;
                // Point in direction of travel
                f.rotation.y = -a + (f.userData.fleet === 'A' ? 0 : Math.PI);
            });

            // Fire lasers
            conflictData.lasers.forEach(laser => {
                if (laser.userData.life <= 0 && Math.random() < 0.03) {
                    // Pick a random fighter to shoot from
                    const shooters = conflictData.fighters.filter(f =>
                        f.userData.fleet === (laser.userData.isBlue ? 'A' : 'B')
                    );
                    const shooter = shooters[Math.floor(Math.random() * shooters.length)];
                    if (shooter) {
                        laser.position.copy(shooter.position);
                        const dir = laser.userData.isBlue ? 1 : -1;
                        laser.userData.velocity.set(
                            dir * (15 + Math.random() * 5),
                            (Math.random() - 0.5) * 3,
                            (Math.random() - 0.5) * 3
                        );
                        laser.userData.life = laser.userData.maxLife;
                        laser.visible = true;
                        laser.lookAt(laser.position.clone().add(laser.userData.velocity));
                    }
                }
                if (laser.userData.life > 0) {
                    laser.position.addScaledVector(laser.userData.velocity, 0.016);
                    laser.userData.life -= 0.016;
                    laser.material.opacity = Math.min(1, laser.userData.life * 2);
                    if (laser.userData.life <= 0) {
                        laser.visible = false;
                        // Chance to trigger explosion
                        if (Math.random() < 0.3) {
                            triggerExplosion(laser.position);
                        }
                    }
                }
            });

            // Animate explosions
            conflictData.explosions.forEach(exp => {
                if (exp.userData.life > 0) {
                    exp.userData.life -= 0.016;
                    const progress = 1 - (exp.userData.life / 1.5);
                    exp.material.opacity = Math.max(0, 1 - progress * progress);
                    const pos = exp.geometry.attributes.position.array;
                    const vel = exp.userData.velocities;
                    for (let i = 0; i < pos.length / 3; i++) {
                        pos[i * 3] += vel[i * 3] * 0.016 * depthScale * 0.5;
                        pos[i * 3 + 1] += vel[i * 3 + 1] * 0.016 * depthScale * 0.5;
                        pos[i * 3 + 2] += vel[i * 3 + 2] * 0.016 * depthScale * 0.5;
                    }
                    exp.geometry.attributes.position.needsUpdate = true;
                } else if (exp.userData.life > -0.5 && exp.userData.life <= 0) {
                    exp.material.opacity = 0;
                    exp.userData.life = -1;
                }
            });
        }

        function triggerExplosion(position) {
            if (!conflictData) return;
            const exp = conflictData.explosions.find(e => e.userData.life < 0);
            if (!exp) return;
            exp.userData.life = 1.5;
            exp.userData.origin.copy(position);
            exp.position.copy(position);
            // Reset particle positions
            const pos = exp.geometry.attributes.position.array;
            for (let i = 0; i < pos.length; i++) pos[i] = 0;
            exp.geometry.attributes.position.needsUpdate = true;
            exp.material.opacity = 1;
        }

        // --- FRACTAL TERRAIN ---
        function createFractalTerrain() {
            const size = 128;
            const geometry = new THREE.PlaneGeometry(20, 20, size - 1, size - 1);
            const positions = geometry.attributes.position.array;

            function noise(x, y) {
                let value = 0, amplitude = 1, frequency = 0.08;
                for (let o = 0; o < 6; o++) {
                    value += Math.sin(x * frequency + o * 1.3) * Math.cos(y * frequency + o * 2.1) * amplitude;
                    value += Math.sin((x + y) * frequency * 0.7 + o) * amplitude * 0.5;
                    amplitude *= 0.5;
                    frequency *= 2.1;
                }
                return value;
            }

            const colors = new Float32Array(positions.length);
            for (let i = 0; i < size * size; i++) {
                const x = positions[i * 3];
                const y = positions[i * 3 + 1];
                const height = noise(x, y) * 2;
                positions[i * 3 + 2] = height;

                const h = (height + 2) / 4;
                const color = new THREE.Color();
                if (h < 0.3) color.setHSL(0.6, 0.8, 0.2 + h);
                else if (h < 0.6) color.setHSL(0.35, 0.7, 0.3 + h * 0.3);
                else color.setHSL(0.1, 0.5, 0.5 + h * 0.3);

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.computeVertexNormals();

            const material = new THREE.MeshPhysicalMaterial({
                vertexColors: true,
                metalness: 0.3,
                roughness: 0.7,
                flatShading: true,
                side: THREE.DoubleSide,
            });

            terrainMesh = new THREE.Mesh(geometry, material);
            terrainMesh.rotation.x = -Math.PI / 2.5;
            terrainMesh.position.y = -2;
            scene.add(terrainMesh);
            currentSceneObjects.push(terrainMesh);

            // Water plane
            const waterGeo = new THREE.PlaneGeometry(20, 20);
            const waterMat = new THREE.MeshPhysicalMaterial({
                color: 0x1144aa, metalness: 0.9, roughness: 0.1,
                transparent: true, opacity: 0.6, side: THREE.DoubleSide,
            });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2.5;
            water.position.y = -2.5;
            scene.add(water);
            currentSceneObjects.push(water);

            // Lights
            const sun = new THREE.DirectionalLight(0xffeedd, 3);
            sun.position.set(5, 10, 5);
            scene.add(sun);
            currentSceneObjects.push(sun);

            const ambient = new THREE.AmbientLight(0x334466, 1);
            scene.add(ambient);
            currentSceneObjects.push(ambient);

            // Floating particles
            const dustCount = 5000;
            const dustGeo = new THREE.BufferGeometry();
            const dustPos = new Float32Array(dustCount * 3);
            for (let i = 0; i < dustCount; i++) {
                dustPos[i * 3] = (Math.random() - 0.5) * 20;
                dustPos[i * 3 + 1] = Math.random() * 8 - 2;
                dustPos[i * 3 + 2] = (Math.random() - 0.5) * 20;
            }
            dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
            const dustMat = new THREE.PointsMaterial({
                size: 0.03, color: 0xaaddff, transparent: true,
                opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false,
            });
            const dust = new THREE.Points(dustGeo, dustMat);
            scene.add(dust);
            currentSceneObjects.push(dust);
        }

        // Background stars
        function createStars() {
            const starGeo = new THREE.BufferGeometry();
            const starCount = 5000;
            const starPos = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 80 + Math.random() * 120;
                starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                starPos[i * 3 + 2] = r * Math.cos(phi);
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ size: 0.15, color: 0xffffff, transparent: true, opacity: 0.8 });
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);
        }
        createStars();
        createConflict();

        // Side-by-side stereo renderer
        function renderSideBySide() {
            const eyeSep = parseFloat(document.getElementById('eyeSep').value);
            const width = window.innerWidth;
            const height = window.innerHeight;

            renderer.setScissorTest(true);

            const strength = eyeSep * 3;

            // Left eye (inverted: positive offset)
            const offsetL = new THREE.Vector3(strength / 2, 0, 0).applyQuaternion(camera.quaternion);
            camera.position.add(offsetL);
            renderer.setViewport(0, 0, width / 2, height);
            renderer.setScissor(0, 0, width / 2, height);
            composer.setSize(width / 2, height);
            composer.render();
            camera.position.sub(offsetL);

            // Right eye (inverted: negative offset)
            const offsetR = new THREE.Vector3(-strength / 2, 0, 0).applyQuaternion(camera.quaternion);
            camera.position.add(offsetR);
            renderer.setViewport(width / 2, 0, width / 2, height);
            renderer.setScissor(width / 2, 0, width / 2, height);
            composer.render();
            camera.position.sub(offsetR);

            renderer.setScissorTest(false);
            composer.setSize(width, height);
        }

        // Animation loop
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = (now - lastTime) / 1000;
            lastTime = now;
            frameCount++;
            if (frameCount % 30 === 0) {
                document.getElementById('fps').textContent = `${Math.round(1 / delta)} FPS`;
            }

            const speed = parseFloat(document.getElementById('speed').value);
            const depthScale = parseFloat(document.getElementById('depth').value);
            time += delta * speed;

            controls.autoRotateSpeed = speed * 2;
            controls.update();

            bloomPass.strength = parseFloat(document.getElementById('bloom').value);

            // Animate current scene
            const currentScene = document.getElementById('scene').value;
            if (currentScene === 'conflict') {
                animateConflict(time, depthScale);
            }

            if (currentScene === 'particles' && particleSystem) {
                particleSystem.rotation.y = time * 0.2;
                const pos = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < 1000; i++) {
                    const idx = Math.floor(Math.random() * pos.length / 3) * 3;
                    pos[idx + 1] += Math.sin(time + pos[idx]) * 0.001 * depthScale;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            if (currentScene === 'geometry' && geometryGroup) {
                geometryGroup.children.forEach((child, i) => {
                    if (i < 4) {
                        child.rotation.x = time * (0.2 + i * 0.1) * (i % 2 ? 1 : -1);
                        child.rotation.y = time * (0.15 + i * 0.08);
                        child.scale.setScalar(1 + Math.sin(time + i) * 0.1 * depthScale * 0.3);
                    } else if (child.userData.orbitAngle !== undefined) {
                        const angle = child.userData.orbitAngle + time * child.userData.orbitSpeed;
                        const r = child.userData.orbitRadius;
                        child.position.x = Math.cos(angle) * r;
                        child.position.z = Math.sin(angle) * r;
                        child.position.y = child.userData.yOffset + Math.sin(time * 2 + angle) * 0.5 * depthScale * 0.3;
                        child.rotation.x = time * 2;
                        child.rotation.z = time * 1.5;
                    }
                });
            }

            if (currentScene === 'terrain' && terrainMesh) {
                const pos = terrainMesh.geometry.attributes.position.array;
                const size = 128;
                for (let i = 0; i < size * size; i++) {
                    const x = pos[i * 3];
                    const y = pos[i * 3 + 1];
                    pos[i * 3 + 2] += Math.sin(time * 0.5 + x * 0.3 + y * 0.3) * 0.002 * depthScale;
                }
                terrainMesh.geometry.attributes.position.needsUpdate = true;
                terrainMesh.geometry.computeVertexNormals();
            }

            // Render based on stereo mode
            const mode = document.getElementById('stereoMode').value;
            if (mode === 'anaglyph') {
                anaglyphEffect.eyeSep = -parseFloat(document.getElementById('eyeSep').value) * 3;
                anaglyphEffect.render(scene, camera);
            } else if (mode === 'sidebyside') {
                renderSideBySide();
            } else {
                composer.render();
            }
        }

        // Scene switching
        document.getElementById('scene').addEventListener('change', (e) => {
            clearScene();
            switch (e.target.value) {
                case 'conflict': createConflict(); break;
                case 'particles': createParticleGalaxy(); break;
                case 'geometry': createSacredGeometry(); break;
                case 'terrain': createFractalTerrain(); break;
            }
        });

        // Resize handler
        window.addEventListener('resize', () => {
            const w = window.innerWidth, h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
            anaglyphEffect.setSize(w, h);
        });

        animate();
    </script>
</body>
