<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TR-808 Drum Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="machine">
        <header class="machine-header">
            <div class="brand">
                <span class="brand-name">RHYTHM COMPOSER</span>
                <span class="model">TR-808</span>
            </div>
            <div class="controls-top">
                <div class="control-group">
                    <label>TEMPO</label>
                    <input type="range" id="tempo" min="40" max="240" value="120">
                    <span id="tempo-display">120</span>
                </div>
                <div class="control-group">
                    <label>VOLUME</label>
                    <input type="range" id="volume" min="0" max="100" value="80">
                </div>
                <div class="control-group">
                    <label>SWING</label>
                    <input type="range" id="swing" min="0" max="100" value="0">
                </div>
                <div class="control-group buttons">
                    <button id="play" class="btn btn-play">▶ PLAY</button>
                    <button id="stop" class="btn btn-stop">■ STOP</button>
                    <button id="clear" class="btn btn-clear">CLEAR</button>
                </div>
            </div>
        </header>

        <div class="instrument-controls">
            <div class="inst-control" data-instrument="kick">
                <label>BASS DRUM</label>
                <div class="knobs">
                    <div class="knob-group"><span>TONE</span><input type="range" min="0" max="100" value="50" data-param="tone"></div>
                    <div class="knob-group"><span>DECAY</span><input type="range" min="0" max="100" value="60" data-param="decay"></div>
                </div>
            </div>
            <div class="inst-control" data-instrument="snare">
                <label>SNARE DRUM</label>
                <div class="knobs">
                    <div class="knob-group"><span>TONE</span><input type="range" min="0" max="100" value="50" data-param="tone"></div>
                    <div class="knob-group"><span>SNAPPY</span><input type="range" min="0" max="100" value="60" data-param="snappy"></div>
                </div>
            </div>
            <div class="inst-control" data-instrument="clap">
                <label>HAND CLAP</label>
                <div class="knobs">
                    <div class="knob-group"><span>DECAY</span><input type="range" min="0" max="100" value="50" data-param="decay"></div>
                </div>
            </div>
            <div class="inst-control" data-instrument="hihat_closed">
                <label>CLOSED HH</label>
                <div class="knobs">
                    <div class="knob-group"><span>DECAY</span><input type="range" min="0" max="100" value="30" data-param="decay"></div>
                </div>
            </div>
            <div class="inst-control" data-instrument="hihat_open">
                <label>OPEN HH</label>
                <div class="knobs">
                    <div class="knob-group"><span>DECAY</span><input type="range" min="0" max="100" value="60" data-param="decay"></div>
                </div>
            </div>
        </div>

        <div class="sequencer">
            <div class="step-numbers">
                <div class="instrument-label"></div>
                <div class="steps-row numbers">
                    <span>1</span><span>2</span><span>3</span><span>4</span>
                    <span>5</span><span>6</span><span>7</span><span>8</span>
                    <span>9</span><span>10</span><span>11</span><span>12</span>
                    <span>13</span><span>14</span><span>15</span><span>16</span>
                </div>
            </div>
            <div class="track" data-instrument="kick">
                <div class="instrument-label">BD</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="snare">
                <div class="instrument-label">SD</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="clap">
                <div class="instrument-label">CP</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="rim">
                <div class="instrument-label">RS</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="tom_low">
                <div class="instrument-label">LT</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="tom_mid">
                <div class="instrument-label">MT</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="tom_hi">
                <div class="instrument-label">HT</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="hihat_closed">
                <div class="instrument-label">CH</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="hihat_open">
                <div class="instrument-label">OH</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="cymbal">
                <div class="instrument-label">CY</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="cowbell">
                <div class="instrument-label">CB</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="conga_hi">
                <div class="instrument-label">HC</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="conga_mid">
                <div class="instrument-label">MC</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="conga_low">
                <div class="instrument-label">LC</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="maracas">
                <div class="instrument-label">MA</div>
                <div class="steps-row"></div>
            </div>
            <div class="track" data-instrument="claves">
                <div class="instrument-label">CL</div>
                <div class="steps-row"></div>
            </div>
        </div>

        <div class="pattern-select">
            <label>PATTERN:</label>
            <button class="pattern-btn active" data-pattern="0">A</button>
            <button class="pattern-btn" data-pattern="1">B</button>
            <button class="pattern-btn" data-pattern="2">C</button>
            <button class="pattern-btn" data-pattern="3">D</button>
        </div>
    </div>

    <script src="audio-engine.js"></script>
    <script src="sequencer.js"></script>
</body>
</html>
